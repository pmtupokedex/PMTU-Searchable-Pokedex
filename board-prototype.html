<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Prototype</title>
<style>html,body{height:100%;margin:0}#app{height:100vh;height:100dvh}</style></head><body>
<div id="app"></div>
<script src="board.js"></script>
<script>
const ctrl=BoardMap.mount(document.getElementById('app'),{mode:'mock',backHref:'index.html'});
// When hosted next to board.json (an editor export) and its map image, load them automatically.
(async function(){const say=x=>ctrl.setStatus(x);let d=null;const tried=[];
 for(const f of ['board.json','Board.json']){try{const r=await fetch(f,{cache:'no-store'});tried.push(f+' → '+r.status);if(r.ok){d=await r.json();break}}catch(e){tried.push(f+' → '+e.message)}}
 if(!d){say(' Autoload: no board file found ('+tried.join('; ')+'). Showing the sample board.');return}
 try{ctrl.loadBoard(d)}catch(e){say(' Autoload: found the board file but could not use it ('+e.message+').');return}
 const n=(d.maps&&d.maps.condensed&&d.maps.condensed.imageName)||'';
 const c=[...new Set([n,n.replace(/ /g,'_'),n.replace(/ /g,'.'),n.replace(/ /g,'-'),n.replace(/ /g,'')].flatMap(x=>[x,x.toLowerCase()]))].filter(Boolean);
 for(const u of c){const ok=await new Promise(res=>{const i=new Image();i.onload=()=>res(true);i.onerror=()=>res(false);i.src=encodeURI(u)});
  if(ok){ctrl.setImage(encodeURI(u));say(ctrl.getStatus()+' Map image: '+u+'.');return}}
 say(ctrl.getStatus()+' No map image found. Tried: '+(c.join(', ')||'(the export names no image)')+'.')})();
</script></body></html>
