<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMTU Searchable Pokédex</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-image: url("https://www.dropbox.com/scl/fi/2mugh0cuugjwkplrmznoo/Pokedex-Background.png?rlkey=uv2nh78t2llbxmte3fl54s94s&st=sp6sn48g&dl=1");
            background-size: 100% 100%;
            background-position: center;
            background-attachment: fixed;
        }

        /* Buttons */
        #open-filters-btn, #open-pokedex-btn {
            position: fixed;
            bottom: 15px;
            background-color: #444;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 30px;
            font-size: 18px;
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        #open-filters-btn {
            right: 15px;
            z-index: 1000;
        }

        #open-pokedex-btn {
            left: 15px;
            z-index: 1000;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: none;
            z-index: 998;
        }
        #overlay.visible { display: block; }

	/* Filter Panel */
        #filter-panel {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: min(70vh, 90vh);
            min-height: 300px;
            background: #ffffff;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.25);
            border-radius: 15px 15px 0 0;
            transform: translateY(100%);
            transition: transform 0.35s ease;
            z-index: 999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .filter-panel-bg {
            position: absolute;
            inset: -10%;
            z-index: -1;
            background-image: url("https://www.dropbox.com/scl/fi/2mugh0cuugjwkplrmznoo/Pokedex-Background.png?rlkey=uv2nh78t2llbxmte3fl54s94s&st=sp6sn48g&dl=1");
            background-size: cover;
            background-position: center;
            filter: brightness(0.5);
        }

        #filter-panel.open {
            transform: translateY(0);
        }

        @media (min-width: 900px) {
            #filter-panel {
                left: auto;
                right: 0;
                top: 0;
                bottom: 0;
                width: 480px;
                max-width: 90vw;
                height: 100vh;
                min-height: 0;
                border-radius: 15px 0 0 15px;
                box-shadow: -4px 0 10px rgba(0,0,0,0.25);
                transform: translateX(100%);
            }

            #filter-panel.open {
                transform: translateX(0);
            }
        }

        #filter-top {
            padding: 20px 20px 15px;
            border-bottom: 1px solid #ddd;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
            scrollbar-gutter: stable;
        }

        #filter-scroll {
            overflow-y: auto;
            padding: 15px 20px 90px;
            flex-grow: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
            scrollbar-gutter: stable;
        }

        .filter-section-header {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px;
            text-transform: uppercase;
            color: white;
            text-shadow:
                -1px -1px 0 black,
                 1px -1px 0 black,
                -1px  1px 0 black,
                 1px  1px 0 black;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .filter-section-header:hover {
            opacity: 0.85;
        }

        .filter-section-header::after {
            content: "▼";
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .filter-section-header.collapsed::after {
            transform: rotate(-90deg);
        }

        #filter-scroll > .filter-section-header {
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            padding-top: 14px;
            margin-top: 20px;
        }

        #filter-scroll > .filter-section-header:first-child {
            border-top: none;
            padding-top: 0;
            margin-top: 0;
        }

        .filter-section-header.collapsed {
            margin-bottom: 10px;
        }

	.specific-region-header {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 5px;
            text-transform: uppercase;
            color: white;
            text-shadow:
                -1px -1px 0 black,
                 1px -1px 0 black,
                -1px  1px 0 black,
                 1px  1px 0 black;
            flex-basis: 100%;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 10px;
        }

        .region-group:first-child .specific-region-header {
            border-top: none;
            padding-top: 0;
        }

        .specific-region-header:hover {
            opacity: 0.85;
        }

        .specific-region-header::after {
            content: "▼";
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .specific-region-header.collapsed::after {
            transform: rotate(-90deg);
        }

        .filter-btn {
            background-color: #ddd;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        .filter-btn.include { background-color: #007bff; color: white; }
        .filter-btn.exclude { background-color: #ff4d4d; color: white; }

        #generation-section,
	#regional-pokedex-section,
        #evolution-section,
        #color-section,
        #types-section,
        #abilities-section,
        #other-section {
            display: flex;
            flex-wrap: wrap;
        }

        #generation-section .filter-btn,
	#regional-pokedex-section .filter-btn,
        #evolution-section .filter-btn,
        #color-section .filter-btn,
        #types-section .filter-btn,
        #abilities-section .filter-btn,
        #other-section .filter-btn {
            flex: 1 1 100px;
        }

        #generation-section .own-row,
	#regional-pokedex-section .own-row,
        #evolution-section .own-row,
        #color-section .own-row,
        #types-section .own-row,
        #abilities-section .own-row,
        #other-section .own-row {
            flex-basis: 100%;
        }

        /* Each region group (Kanto, Johto, etc.) is its own flex row so its
           buttons grow to fill space independently of the other regions */
        .region-group {
            display: flex;
            flex-wrap: wrap;
        }

        .region-group .filter-btn {
            flex: 1 1 100px;
        }

        /* Force these two sections into a fixed 2-column layout instead of
           the flexible wrap, so short trailing items (like Teleport/Paradox)
           don't end up stranded alone on their own row */
        #color-section,
        #abilities-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        #color-section .own-row,
        #abilities-section .own-row {
            grid-column: 1 / -1;
        }

        /* Sub-grid for the Mega Evolution / Gigantamax related buttons */
        .evo-mega-gmax-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        #reset-filters-btn {
            display: block;
            width: fit-content;
            margin: 10px auto 0;
        }

        #tag-search {
            padding: 10px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            margin-top: 10px;
        }

        /* ⭐ Responsive Gallery Grid */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 15%));
            gap: 15px;
            max-width: 100%;
            margin: 20px auto;
            padding: 0 10px;
		justify-content: center;
		place-content: center;
        }

        .image-card {
            width: 100%;
            background: transparent;
            display: none;
        }
        .image-card.show { display: block; }

        .image-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            cursor: pointer;
            filter:
                drop-shadow(3px 3px 4px rgba(0,0,0,0.55));
        }

        /* Fullscreen viewer */
        #image-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        #image-overlay.visible { display: flex; }

        #viewer-frame {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #image-wrapper {
            position: relative;
            display: inline-block;
        }

        #overlay-img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: none;
        }

        #image-close-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            font-size: 24px;
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Pokédex Panel — three layered panels */
        #pokedex-panel {
            position: fixed;
            inset: 0;
            z-index: 1500;
            pointer-events: none;
        }

        #pokedex-panel-1,
        #pokedex-panel-2,
        #pokedex-panel-3,
	#pokedex-panel-4 {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: auto;
        }

        /* Panel 1 and 4: back layer — full-screen background + Pokedex logo, fades out on close */
        #pokedex-panel-1,
	#pokedex-panel-4 {
            z-index: 1;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

	#pokedex-panel-4 {
	    z-index: 2000;
	}

        #pokedex-panel.closed #pokedex-panel-1 {
            opacity: 0;
            pointer-events: none;
        }

        #pokedex-panel.closed #pokedex-panel-4 {
            opacity: 0;
            pointer-events: none;
        }

        /* Panel 2: top band, retracts up off the top of the screen on close */
        #pokedex-panel-2 {
            top: 0;
            left: 0;
            width: 100%;
            height: clamp(50vh, 50vh, 100vh);
            z-index: 2;
            transition: transform 0.7s ease;
            transform: translateY(0);
        }

        #pokedex-panel.closed #pokedex-panel-2 {
            transform: translateY(-125%);
        }

        /* Panel 3: bottom band, retracts down off the bottom of the screen on close */
        #pokedex-panel-3 {
            top: auto;
            bottom: 0;
            left: 0;
            width: 100%;
            height: clamp(50vh, 50vh, 100vh);
            z-index: 2;
            transition: transform 0.7s ease;
            transform: translateY(0);
        }

        #pokedex-panel.closed #pokedex-panel-3 {
            transform: translateY(125%);
        }

        /* Panel 4 uses the shared full-screen inset:0 from panel 1/2/3's
           base rule above — giving its background room to scale at the
           same rate as panels 2/3 without clipping the circle graphic
           (see reasoning on the .pokedex-bg rule below). */

        /* Shared background layer. Panel 1's is sized slightly larger than its
           panel so the blur doesn't reveal transparent edges; panels 2 & 3
           fill their own (smaller) band exactly. */
        .pokedex-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }

        #pokedex-panel-1 .pokedex-bg {
            background-image: url("https://www.dropbox.com/scl/fi/2mugh0cuugjwkplrmznoo/Pokedex-Background.png?rlkey=uv2nh78t2llbxmte3fl54s94s&st=sp6sn48g&dl=1");
            background-size: 100% 100%;
        }

        #pokedex-panel-2 .pokedex-bg {
            background-image: url("https://www.dropbox.com/scl/fi/cib800xjgd3wqr8gjfi1t/Pokedex-Half.png?rlkey=cuxgt7b3t2nr01fg6yttci7bz&st=mu2isprz&dl=1");
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: center bottom;
        }

        #pokedex-panel-3 .pokedex-bg {
            background-image: url("https://www.dropbox.com/scl/fi/cib800xjgd3wqr8gjfi1t/Pokedex-Half.png?rlkey=cuxgt7b3t2nr01fg6yttci7bz&st=mu2isprz&dl=1");
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: center bottom;
            transform: scaleY(-1);
        }

        /* Panel 4 is now full-screen (see note above), giving the graphic
           enough room to use the same width-locked scaling rate as panels
           2/3 without the circle clipping until well past 4:1 aspect ratio
           — the canvas is transparent outside the circle, so the extra
           room doesn't cause any visible side effects. */
        #pokedex-panel-4 .pokedex-bg {
            background-image: url("https://www.dropbox.com/scl/fi/bofvruh7n2qx354c8s7gl/Pokedex-Start-lg.png?rlkey=iu6kja0nu8t7orv0u209c87n8&st=mwhqzlrr&dl=1");
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Invisible circular click zone matching the 950px graphic centered
           in the 3840x1920 lg image. Uses the same width-based percentage
           as the background above, so it tracks the visible graphic exactly. */
        #pokedex-click-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(950 / 3840 * 100%);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
        }

        /* Switch to height-locked (crop left/right) sizing a bit before the
           strict 1:1 orientation boundary, since the width-locked sizing
           above stops fully covering the panel's height slightly before
           that point on wider-than-tall screens */
        @media (max-aspect-ratio: 1/1) {
            #pokedex-panel-2 .pokedex-bg,
            #pokedex-panel-3 .pokedex-bg {
                background-size: auto 100%;
            }
        }

    </style>
</head>
<body>

    <button id="open-pokedex-btn">Close Pokédex</button>
    <button id="open-filters-btn">Filters</button>

    <div id="overlay"></div>

    <div id="pokedex-panel">
	<div id="pokedex-panel-4">
	    <div class="pokedex-bg"></div>
	    <div id="pokedex-click-zone" role="button" aria-label="Close Pokédex"></div>
        </div>
        <div id="pokedex-panel-3">
            <div class="pokedex-bg"></div>
        </div>
        <div id="pokedex-panel-2">
            <div class="pokedex-bg"></div>
        </div>
        <div id="pokedex-panel-1">
            <div class="pokedex-bg"></div>
        </div>
    </div>


    <div id="filter-panel">
        <div class="filter-panel-bg"></div>
        <div id="filter-top">
            <input type="text" id="tag-search" placeholder="Search tags (space-separated, use -tag to exclude)">
            <br>
            <button id="reset-filters-btn" class="filter-btn">Clear All Filters</button>
        </div>

        <div id="filter-scroll">
            <div class="filter-section-header">Generation</div>
	    <div id="generation-section">
                <button class="filter-btn" data-tag="gen1">Gen 1</button>
                <button class="filter-btn" data-tag="gen2">Gen 2</button>
                <button class="filter-btn" data-tag="gen3">Gen 3</button>
                <button class="filter-btn" data-tag="gen4">Gen 4</button>
                <button class="filter-btn" data-tag="gen5">Gen 5</button>
                <button class="filter-btn" data-tag="gen6">Gen 6</button>
                <button class="filter-btn" data-tag="gen7">Gen 7</button>
                <button class="filter-btn" data-tag="gen8">Gen 8</button>
                <button class="filter-btn" data-tag="gen9">Gen 9</button>
                <button class="filter-btn own-row" id="show-all-generation">Show All</button>
	    </div>

            <div class="filter-section-header">Regional Pokédex</div>
            <div id="regional-pokedex-section">
		<div class="own-row region-group" id="kanto">
		<div class="specific-region-header">Kanto</div>
                    <button class="filter-btn" data-tag="kanto">Original Kanto Pokédex</button>
                    <button class="filter-btn" data-tag="letsgokanto">Let's Go! Kanto Pokédex</button>
                    <button class="filter-btn" data-tag="optkanto">Optional Kanto Pokémon</button>
		</div>
		<div class="own-row region-group" id="johto">
		<div class="specific-region-header">Johto</div>
                    <button class="filter-btn" data-tag="johto">Johto's "New Pokédex"</button>
                    <button class="filter-btn" data-tag="expjohto">Expanded Johto Pokédex</button>
                    <button class="filter-btn" data-tag="optjohto">Optional Johto Pokémon</button>
		</div>
		<div class="own-row region-group" id="hoenn">
		<div class="specific-region-header">Hoenn</div>
                    <button class="filter-btn" data-tag="hoenn">Original Hoenn Pokédex</button>
                    <button class="filter-btn" data-tag="exphoenn">Expanded Hoenn Pokédex</button>
                    <button class="filter-btn" data-tag="spechoenn">Special Hoenn Pokémon</button>
		</div>
		<div class="own-row region-group" id="Sinnoh">
		<div class="specific-region-header">Sinnoh</div>
                    <button class="filter-btn" data-tag="sinnoh">Original Sinnoh Pokédex</button>
                    <button class="filter-btn" data-tag="expsinnoh">Enhanced Sinnoh Pokédex</button>
                    <button class="filter-btn" data-tag="excsinnoh">Excluded Sinnoh Pokémon</button>
                    <button class="filter-btn" data-tag="optsinnoh">Optional Sinnoh Pokémon</button>
		</div>
		<div class="own-row region-group" id="Unova">
		<div class="specific-region-header">Unova</div>
                    <button class="filter-btn" data-tag="unova">Original Unova Pokédex</button>
                    <button class="filter-btn" data-tag="expunova">Expanded Unova Pokédex</button>
		</div>
		<div class="own-row region-group" id="kalos">
		<div class="specific-region-header">Kalos</div>
                    <button class="filter-btn" data-tag="kalos">Kalos Pokédex</button>
		</div>
		<div class="own-row region-group" id="alola">
		<div class="specific-region-header">Alola</div>
                    <button class="filter-btn" data-tag="alola">Original Alola Pokédex</button>
                    <button class="filter-btn" data-tag="expalola">Expanded Alola Pokédex</button>
		</div>
		<div class="own-row region-group" id="galar">
		<div class="specific-region-header">Galar</div>
                    <button class="filter-btn" data-tag="galar">Galar Pokédex</button>
                    <button class="filter-btn" data-tag="isleofarmor">Isle of Armor Expansion</button>
                    <button class="filter-btn" data-tag="crowntundra">Crown Tundra Expansion</button>
		</div>
		<div class="own-row region-group" id="paldea">
		<div class="specific-region-header">Paldea</div>
                    <button class="filter-btn" data-tag="paldea">Paldea Pokédex</button>
                    <button class="filter-btn" data-tag="kitakami">Kitakami Expansion</button>
                    <button class="filter-btn" data-tag="blueberry">Blueberry Expansion</button>
		</div>
		<div class="own-row region-group" id="hisui">
		<div class="specific-region-header">Hisui</div>
                    <button class="filter-btn" data-tag="hisui">Hisui Pokédex</button>
		</div>
		<div class="own-row region-group" id="lumiose">
		<div class="specific-region-header">Lumiose City</div>
                    <button class="filter-btn" data-tag="lumiose">Lumiose City Pokédex</button>
                    <button class="filter-btn" data-tag="hyperspace">Hyperspace Expansion</button>
                    <button class="filter-btn" data-tag="speclumiose">Special Lumiose City Pokémon</button>
		</div>
		<div class="own-row region-group" id="ransei">
		<div class="specific-region-header">Ransei</div>
                    <button class="filter-btn" data-tag="ransei">Ransei Pokédex</button>
		</div>
		<div class="own-row region-group" id="orangeislands">
		<div class="specific-region-header">Orange Islands</div>
                    <button class="filter-btn" data-tag="orangeislands">Orange Islands Pokédex</button>
                    <button class="filter-btn" data-tag="animepreview">Anime Preview Expansion</button>
		</div>
                <button class="filter-btn own-row" id="show-all-regional">Show All</button>
            </div>

            <div class="filter-section-header">Evolution State</div>
            <div id="evolution-section">
                <button class="filter-btn" data-tag="stage1">Stage 1</button>
                <button class="filter-btn" data-tag="stage2">Stage 2</button>
                <button class="filter-btn" data-tag="stage3">Stage 3</button>
                <button class="filter-btn" data-tag="canevolve">Can Evolve</button>
                <button class="filter-btn" data-tag="hasevolved">Has Evolved</button>
                <button class="filter-btn" data-tag="splitevo">Split Evolution</button>
                <div class="own-row evo-mega-gmax-grid">
                    <button class="filter-btn" data-tag="canmega">Can Mega Evolve</button>
                    <button class="filter-btn" data-tag="evocanmega">Evolution Can Mega Evolve</button>
                    <button class="filter-btn" data-tag="cangmax">Can Gigantamax</button>
                    <button class="filter-btn" data-tag="evocangmax">Evolution Can Gigantamax</button>
                </div>
                <button class="filter-btn own-row" data-tag="noevo">Does Not Evolve</button>
                <button class="filter-btn own-row" id="show-all-stage">Show All</button>
            </div>

	    <div class="filter-section-header">Token Color</div>
	    <div id="color-section">
		<button class="filter-btn" data-tag="pink">Pink</button>
		<button class="filter-btn" data-tag="green">Green</button>
		<button class="filter-btn" data-tag="blue">Blue</button>
		<button class="filter-btn" data-tag="yellow">Yellow</button>
		<button class="filter-btn" data-tag="red">Red</button>
		<button class="filter-btn" data-tag="legendary">Legendary</button>
		<button class="filter-btn" data-tag="mega">Mega Evolution</button>
		<button class="filter-btn" data-tag="ultrabeast">Ultra Beast</button>
		<button class="filter-btn" data-tag="gmax">Gigantamax</button>
		<button class="filter-btn" data-tag="paradox">Paradox</button>
		<button class="filter-btn own-row" id="show-all-color">Show All</button>
	    </div>

	    <div class="filter-section-header">Pokémon Types</div>
	    <div id="types-section">
		<button class="filter-btn" data-tag="bug">Bug</button>
		<button class="filter-btn" data-tag="dark">Dark</button>
		<button class="filter-btn" data-tag="dragon">Dragon</button>
		<button class="filter-btn" data-tag="electric">Electric</button>
		<button class="filter-btn" data-tag="fairy">Fairy</button>
		<button class="filter-btn" data-tag="fighting">Fighting</button>
		<button class="filter-btn" data-tag="fire">Fire</button>
		<button class="filter-btn" data-tag="flying">Flying</button>
		<button class="filter-btn" data-tag="ghost">Ghost</button>
		<button class="filter-btn" data-tag="grass">Grass</button>
		<button class="filter-btn" data-tag="ground">Ground</button>
		<button class="filter-btn" data-tag="ice">Ice</button>
		<button class="filter-btn" data-tag="normal">Normal</button>
		<button class="filter-btn" data-tag="poison">Poison</button>
		<button class="filter-btn" data-tag="psychic">Psychic</button>
		<button class="filter-btn" data-tag="rock">Rock</button>
		<button class="filter-btn" data-tag="steel">Steel</button>
		<button class="filter-btn" data-tag="water">Water</button>
		<button id="types-match-toggle" class="filter-btn own-row">Match: Any</button>
		<button class="filter-btn own-row" id="show-all-types">Show All</button>
	    </div>

	    <div class="filter-section-header">Token Abilities</div>
	    <div id="abilities-section">
		<button class="filter-btn" data-tag="dig">Dig</button>
		<button class="filter-btn" data-tag="fly">Fly</button>
		<button class="filter-btn" data-tag="surf">Surf</button>
		<button class="filter-btn" data-tag="teleport">Teleport</button>
		<button class="filter-btn own-row" id="show-all-abilities">Show All</button>
	    </div>

	    <div class="filter-section-header">Other Filters</div>
	    <div id="other-section">
		<button class="filter-btn" data-tag="starter">Starter</button>
		<button class="filter-btn" data-tag="regional">Regional Forms</button>
		<button class="filter-btn" data-tag="formchange">Has Multiple Forms</button>
		<button class="filter-btn" data-tag="fossil">Fossil</button>
		<button class="filter-btn" data-tag="ultrabeast">Ultra Beast</button>
		<button class="filter-btn" data-tag="paradox">Paradox</button>
		<button class="filter-btn" data-tag="special">Special</button>
		<button class="filter-btn" data-tag="tvinterviewer">TV Interviewer</button>
		<button class="filter-btn" data-tag="pokestar">Pokéstar Studios</button>
		<button class="filter-btn own-row" id="show-all-other">Show All</button>
	    </div>

        </div>
    </div>

    <div class="gallery-container" id="gallery"></div>

    <div id="image-overlay">
        <div id="viewer-frame">
            <div id="image-wrapper">
                <img id="overlay-img" src="" alt="">
                <button id="image-close-btn">✕</button>
            </div>
        </div>
    </div>

    <script>
        // Register the service worker that caches Pokémon images locally.
        // Requires HTTPS (or localhost) — silently no-ops otherwise, e.g. if
        // this file is opened directly from disk as a file:// URL.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service worker registered, scope:', reg.scope))
                    .catch(err => console.warn('Service worker registration failed:', err));
            });
        }

        let includeFilters = [];
        let excludeFilters = [];
        let typeIncludeFilters = [];
        let typesMatchAll = false;

        const gallery = document.getElementById("gallery");
        const panel = document.getElementById('filter-panel');
        const overlay = document.getElementById('overlay');
        const openBtn = document.getElementById('open-filters-btn');

        const pokedexPanel = document.getElementById("pokedex-panel");
        const pokedexBtn = document.getElementById("open-pokedex-btn");

        function openPokedexPanels() {
            pokedexPanel.classList.remove("closed");
        }

        function closePokedexPanels() {
            pokedexPanel.classList.add("closed");
        }

        pokedexBtn.addEventListener("click", () => {
            const isClosed = pokedexPanel.classList.contains("closed");

            if (panel.classList.contains("open")) {
                panel.classList.remove("open");
                overlay.classList.remove("visible");
            }

            if (isClosed) {
                openPokedexPanels();
            } else {
                closePokedexPanels();
            }
        });

        document.getElementById("pokedex-click-zone").addEventListener("click", closePokedexPanels);

        fetch("https://raw.githubusercontent.com/pmtupokedex/PMTU-Searchable-Pokedex/main/pokemon-data.json")
            .then(response => response.json())
            .then(data => {
                data.forEach(p => {
                    const card = document.createElement("div");
                    card.className = "image-card";
                    card.dataset.tags = p.tags.join(" ");

                    const img = document.createElement("img");
                    img.src = p.src;
                    img.alt = p.name;

                    card.appendChild(img);
                    gallery.appendChild(card);
                });

                attachImageEvents();
                filterGallery();
            });

        function attachImageEvents() {
            document.querySelectorAll('.image-card img').forEach(img => {
                img.addEventListener('click', () => openImageViewer(img.src));
            });
        }


        function parseSearchFilters() {
            includeFilters = includeFilters.filter(f => !f.startsWith("search:"));
            excludeFilters = excludeFilters.filter(f => !f.startsWith("search:"));

            const input = document.getElementById('tag-search').value.trim().toLowerCase();
            if (!input) return;

            const parts = input.split(/\s+/);
            parts.forEach(tag => {
                if (tag.startsWith("-")) {
                    excludeFilters.push("search:" + tag.substring(1));
                } else {
                    includeFilters.push("search:" + tag);
                }
            });
        }

        function updateFilters() {
            includeFilters = [];
            excludeFilters = [];
            typeIncludeFilters = [];

            document.querySelectorAll('.filter-btn.include[data-tag]').forEach(btn => {
                const tag = btn.dataset.tag.toLowerCase();
                const inTypesSection = btn.closest('#types-section') !== null;
                if (inTypesSection && typesMatchAll) {
                    typeIncludeFilters.push(tag);
                } else {
                    includeFilters.push(tag);
                }
            });
            document.querySelectorAll('.filter-btn.exclude[data-tag]').forEach(btn =>
                excludeFilters.push(btn.dataset.tag.toLowerCase())
            );

            parseSearchFilters();
            filterGallery();
        }

        function filterGallery() {
            const cards = document.querySelectorAll('.image-card');
            cards.forEach(card => {
                const tags = card.dataset.tags.toLowerCase().split(/\s+/);
                const includeMatch =
                    includeFilters.length === 0 ||
                    includeFilters.some(f => tags.includes(f.replace("search:", "")));
                const typeMatch =
                    typeIncludeFilters.length === 0 ||
                    typeIncludeFilters.every(f => tags.includes(f));
                const excludeMatch =
                    excludeFilters.some(f => tags.includes(f.replace("search:", "")));
                card.classList.toggle('show', includeMatch && typeMatch && !excludeMatch);
            });
        }

        document.getElementById('types-match-toggle').addEventListener('click', function () {
            typesMatchAll = !typesMatchAll;
            this.textContent = typesMatchAll ? "Match: All" : "Match: Any";
            updateFilters();
        });

        function resetFilters() {
            includeFilters = [];
            excludeFilters = [];
            document.getElementById('tag-search').value = "";
            document.querySelectorAll('.filter-btn[data-tag]').forEach(btn =>
                btn.classList.remove('include', 'exclude')
            );
            filterGallery();
        }

        function resetGeneration() {
            document.querySelectorAll('#generation-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetRegional() {
            document.querySelectorAll('#regional-pokedex-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetStage() {
            document.querySelectorAll('#evolution-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetColor() {
            document.querySelectorAll('#color-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetTypes() {
            document.querySelectorAll('#types-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetAbilities() {
            document.querySelectorAll('#abilities-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetOther() {
            document.querySelectorAll('#other-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function syncTagButtons(btn) {
            const tag = btn.dataset.tag;
            if (!tag) return;
            document.querySelectorAll(`.filter-btn[data-tag="${tag}"]`).forEach(other => {
                if (other === btn) return;
                other.classList.remove("include", "exclude");
                if (btn.classList.contains("include")) other.classList.add("include");
                if (btn.classList.contains("exclude")) other.classList.add("exclude");
            });
        }

        function toggleIncludeState(btn) {
            if (!btn.dataset.tag) return;
            if (btn.classList.contains("include")) {
                btn.classList.remove("include");
            } else {
                btn.classList.remove("exclude");
                btn.classList.add("include");
            }
            syncTagButtons(btn);
            updateFilters();
        }

        function setExcludeState(btn) {
            if (!btn.dataset.tag) return;
            btn.classList.remove("include");
            btn.classList.add("exclude");
            syncTagButtons(btn);
            updateFilters();
        }

        const LONG_PRESS_MS = 750;

        document.querySelectorAll('.filter-btn[data-tag]').forEach(btn => {
            let pressTimer = null;
            let longPressFired = false;

            const startPress = () => {
                longPressFired = false;
                pressTimer = setTimeout(() => {
                    longPressFired = true;
                    setExcludeState(btn);
                }, LONG_PRESS_MS);
            };

            const cancelPress = () => {
                clearTimeout(pressTimer);
            };

            const endPress = () => {
                clearTimeout(pressTimer);
                if (!longPressFired) {
                    toggleIncludeState(btn);
                }
            };

            btn.addEventListener('pointerdown', startPress);
            btn.addEventListener('pointerup', endPress);
            btn.addEventListener('pointerleave', cancelPress);
            btn.addEventListener('pointercancel', cancelPress);
            btn.addEventListener('contextmenu', (e) => e.preventDefault());
        });

        document.getElementById('show-all-generation').addEventListener('click', resetGeneration);
        document.getElementById('show-all-regional').addEventListener('click', resetRegional);
        document.getElementById('show-all-stage').addEventListener('click', resetStage);
        document.getElementById('show-all-color').addEventListener('click', resetColor);
        document.getElementById('show-all-types').addEventListener('click', resetTypes);
        document.getElementById('show-all-abilities').addEventListener('click', resetAbilities);
        document.getElementById('show-all-other').addEventListener('click', resetOther);
        document.getElementById('reset-filters-btn').addEventListener('click', resetFilters);
        document.getElementById('tag-search').addEventListener('input', updateFilters);

        function toggleDrawer() {
            const isOpen = panel.classList.contains('open');
            if (isOpen) {
                panel.classList.remove('open');
                overlay.classList.remove('visible');
            } else {
                panel.classList.add('open');
                overlay.classList.add('visible');
            }
        }

        openBtn.addEventListener('click', () => {
            if (!openBtn.disabled) toggleDrawer();
        });

        overlay.addEventListener('click', () => {
            panel.classList.remove('open');
            overlay.classList.remove('visible');
        });

        const imageOverlay = document.getElementById('image-overlay');
        const overlayImg = document.getElementById('overlay-img');
        const imageCloseBtn = document.getElementById('image-close-btn');

        function openImageViewer(src) {
            overlayImg.src = src;
            imageOverlay.classList.add('visible');

            panel.classList.remove('open');
            overlay.classList.remove('visible');

            openBtn.disabled = true;
            openBtn.style.opacity = "0.5";
            openBtn.style.cursor = "not-allowed";
        }

        function closeImageViewer() {
            imageOverlay.classList.remove('visible');
            overlayImg.src = "";
            openBtn.disabled = false;
            openBtn.style.opacity = "1";
            openBtn.style.cursor = "pointer";
        }

        const imageWrapper = document.getElementById('image-wrapper');

        imageOverlay.addEventListener('click', (e) => {
            if (!imageWrapper.contains(e.target)) closeImageViewer();
        });

        imageCloseBtn.addEventListener('click', closeImageViewer);

        document.querySelectorAll('.filter-section-header').forEach(header => {
            header.classList.add('collapsed');
            if (header.nextElementSibling) {
                header.nextElementSibling.style.display = 'none';
            }
            header.addEventListener('click', () => {
                header.classList.toggle('collapsed');
                const section = header.nextElementSibling;
                if (section) {
                    section.style.display = header.classList.contains('collapsed') ? 'none' : '';
                }
            });
        });

        document.querySelectorAll('.specific-region-header').forEach(header => {
            header.classList.add('collapsed');
            let sibling = header.nextElementSibling;
            while (sibling) {
                sibling.style.display = 'none';
                sibling = sibling.nextElementSibling;
            }
            header.addEventListener('click', () => {
                header.classList.toggle('collapsed');
                const collapsed = header.classList.contains('collapsed');
                let sib = header.nextElementSibling;
                while (sib) {
                    sib.style.display = collapsed ? 'none' : '';
                    sib = sib.nextElementSibling;
                }
            });
        });

        filterGallery();

    </script>
</body>
</html>
