            document.querySelectorAll('#types-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetAbilities() {
            document.querySelectorAll('#abilities-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            // Lives visually inside this section's controls but has no
            // data-tag, so the loop above doesn't reach it — reset
            // explicitly so "Show All" here really does show all.
            hideNoAbility = false;
            hideNoAbilityToggle.textContent = "Hide Pokémon Without Abilities";
            updateFilters();
        }

        function resetOther() {
            document.querySelectorAll('#other-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function syncTagButtons(btn) {
            const tag = btn.dataset.tag;
            if (!tag) return;
            document.querySelectorAll(`.filter-btn[data-tag="${tag}"]`).forEach(other => {
                if (other === btn) return;
                other.classList.remove("include", "exclude");
                if (btn.classList.contains("include")) other.classList.add("include");
                if (btn.classList.contains("exclude")) other.classList.add("exclude");
            });
        }

        function toggleIncludeState(btn) {
            if (!btn.dataset.tag) return;
            if (btn.classList.contains("include")) {
                btn.classList.remove("include");
            } else {
                btn.classList.remove("exclude");
                btn.classList.add("include");
            }
            syncTagButtons(btn);
            updateFilters();
        }

        function setExcludeState(btn) {
            if (!btn.dataset.tag) return;
            btn.classList.remove("include");
            btn.classList.add("exclude");
            syncTagButtons(btn);
            updateFilters();
        }

        const LONG_PRESS_MS = 750;

        document.querySelectorAll('.filter-btn[data-tag]').forEach(btn => {
            let pressTimer = null;
            let longPressFired = false;

            const startPress = () => {
                longPressFired = false;
                pressTimer = setTimeout(() => {
                    longPressFired = true;
                    setExcludeState(btn);
                }, LONG_PRESS_MS);
            };

            const cancelPress = () => {
                clearTimeout(pressTimer);
            };

            const endPress = () => {
                clearTimeout(pressTimer);
                if (!longPressFired) {
                    toggleIncludeState(btn);
                }
            };

            btn.addEventListener('pointerdown', startPress);
            btn.addEventListener('pointerup', endPress);
            btn.addEventListener('pointerleave', cancelPress);
            btn.addEventListener('pointercancel', cancelPress);
            btn.addEventListener('contextmenu', (e) => e.preventDefault());
        });

        document.getElementById('show-all-generation').addEventListener('click', resetGeneration);
        document.getElementById('show-all-regional').addEventListener('click', resetRegional);
        document.getElementById('show-all-stage').addEventListener('click', resetStage);
        document.getElementById('show-all-color').addEventListener('click', resetColor);
        document.getElementById('show-all-types').addEventListener('click', resetTypes);
        document.getElementById('show-all-abilities').addEventListener('click', resetAbilities);
        document.getElementById('show-all-other').addEventListener('click', resetOther);
        document.getElementById('reset-filters-btn').addEventListener('click', resetFilters);
        document.getElementById('tag-search').addEventListener('input', updateFilters);

        // Matches the CSS breakpoint where the filter panel switches from a
        // full-screen mobile sheet to a desktop sidebar that shares space
        // with the gallery instead of covering it.
        const desktopFilterQuery = window.matchMedia('(min-width: 900px)');

        // On mobile, the filter panel is a full-screen sheet, so once the
        // on-screen keyboard is up there's no visible gallery left to tap
        // for the usual "click empty space closes it" behavior — the
        // keyboard's own Done/Go/checkmark key (whatever a given phone
        // labels it) is really the only way back. That key always reaches
        // the page as a standard Enter keydown regardless of its on-screen
        // label, so listening for Enter here is the portable way to catch
        // it. Scoped to mobile only — on desktop, Enter in a search box is
        // just a regular keystroke, and closing the whole sidebar because
        // of it would be surprising rather than helpful there.
        const tagSearchInput = document.getElementById('tag-search');
        tagSearchInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' || desktopFilterQuery.matches) return;
            e.preventDefault();
            tagSearchInput.blur(); // dismiss the keyboard — closing the panel alone doesn't reliably do this on its own
            closeFilterPanel();
        });

        // Turns on body's padding transition for a short window right when
        // a panel actually opens/closes, then turns it back off — see the
        // CSS comment on body.panel-animating for why it can't just stay on.
        let panelAnimTimeout = null;
        function beginPanelAnim() {
            document.body.classList.add('panel-animating');
            if (panelAnimTimeout) clearTimeout(panelAnimTimeout);
            panelAnimTimeout = setTimeout(() => {
                document.body.classList.remove('panel-animating');
                panelAnimTimeout = null;
            }, 500); // 400ms base * 1.25, slowed 25% to match body.panel-animating's transition duration
        }

        function openFilterPanel() {
            if (!panel.classList.contains('open')) {
                panel.classList.add('open');
                closeImageViewer();
                beginPanelAnim();
                if (desktopFilterQuery.matches) {
                    // Desktop: gallery reserves space and stays interactive —
                    // no dimming, no scroll lock needed.
                    document.body.classList.add('filters-open');
                } else {
                    // Mobile: panel is full-screen, so the gallery underneath
                    // is genuinely hidden — dim it and lock scrolling.
                    overlay.classList.add('visible');
                    window.pageScrollLock.lock();
                }
            }
        }

        function closeFilterPanel() {
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                beginPanelAnim();
                if (desktopFilterQuery.matches) {
                    document.body.classList.remove('filters-open');
                } else {
                    overlay.classList.remove('visible');
                    window.pageScrollLock.unlock();
                }
            }
        }

        // If the breakpoint is crossed while the panel happens to be open
        // (e.g. rotating a tablet), reconcile which mode's side-effects
        // (dimming/lock vs. reserved space) are currently in play, rather
        // than leaving stale ones behind.
        desktopFilterQuery.addEventListener('change', (e) => {
            if (!panel.classList.contains('open')) return;
            if (e.matches) {
                overlay.classList.remove('visible');
                window.pageScrollLock.unlock();
                document.body.classList.add('filters-open');
            } else {
                document.body.classList.remove('filters-open');
                overlay.classList.add('visible');
                window.pageScrollLock.lock();
            }
        });

        function toggleDrawer() {
            if (panel.classList.contains('open')) {
                closeFilterPanel();
            } else {
                openFilterPanel();
            }
        }

        openBtn.addEventListener('click', () => {
            if (!openBtn.disabled) toggleDrawer();
        });

        overlay.addEventListener('click', () => {
            closeFilterPanel();
        });

        const imageOverlay = document.getElementById('image-overlay');
        const overlayImg = document.getElementById('overlay-img');
        const imageCloseBtn = document.getElementById('image-close-btn');
        const imagePrevBtn = document.getElementById('image-prev-btn');
        const imageNextBtn = document.getElementById('image-next-btn');
        const imagePrevArrow = imagePrevBtn.querySelector('.nav-arrow');
        const imageNextArrow = imageNextBtn.querySelector('.nav-arrow');
        const viewerInfoToggle = document.getElementById('viewer-info-toggle');
        const viewerRelatedToggle = document.getElementById('viewer-related-toggle');
        const viewerRelatedGrid = document.getElementById('viewer-related-grid');
        const viewerInfoContent = document.getElementById('viewer-info-content');

        // A single reusable <audio> element for Pokémon cries — reused
        // rather than created per-click so mashing the button restarts the
        // sound instead of overlapping multiple copies of it.
        const cryAudio = new Audio();
        viewerInfoContent.addEventListener('click', (e) => {
            const btn = e.target.closest('.poke-info-cry-btn');
            if (!btn || !btn.dataset.cryUrl) return;
            cryAudio.src = btn.dataset.cryUrl;
            cryAudio.currentTime = 0;
            cryAudio.play().catch(() => { /* ignore playback errors (e.g. file missing) */ });
        });

        let activeGalleryImg = null;

        const PANEL_TRANSITION_MS = 500; // matches beginPanelAnim's own duration (0.35s base * 1.25, slowed 25%)

        // Briefly pulses an image's card to draw the eye to its new
        // position after a scroll settles. Removing the class first and
        // forcing a reflow (offsetWidth read) lets the animation restart
        // cleanly if it's re-triggered before the previous pulse finished,
        // rather than being ignored because the class was already present.
        // Takes the img (matching every caller's existing identity
        // reference) but pulses its enclosing .image-card instead — see the
        // .image-card.gallery-pulse CSS comment for why it lives there now.
        function pulseAttention(img) {
            const card = img.closest('.image-card') || img;
            card.classList.remove('gallery-pulse');
            void card.offsetWidth;
            card.classList.add('gallery-pulse');
            card.addEventListener('animationend', () => {
                card.classList.remove('gallery-pulse');
            }, { once: true });
        }

        // Same restart-safe class-toggle pattern as pulseAttention above,
        // applied directly to a prev/next arrow span on click instead of a
        // gallery card.
        function pulseNavArrow(arrow) {
            arrow.classList.remove('gallery-pulse');
            void arrow.offsetWidth;
            arrow.classList.add('gallery-pulse');
            arrow.addEventListener('animationend', () => {
                arrow.classList.remove('gallery-pulse');
            }, { once: true });
        }

        // Where an image should land: centered in whatever vertical space
        // is left below the panel, rather than centered in the full
        // viewport. On mobile this means the reserved padding-top (the
        // panel's own height) is excluded from the centering math; on
        // desktop the panel docks left instead, so it never contributes to
        // padding-top and this collapses back to ordinary full-height
        // centering automatically. It also naturally converges to
        // full-viewport centering once a close animation finishes and
        // padding-top has shrunk back to its base value — so this same
        // calculation covers opening, closing, and switching between
        // images without needing separate cases for each.
        const BASE_PADDING_TOP = 20; // body's un-panelled padding-top

        function neededScrollDelta(img) {
            const rect = img.getBoundingClientRect();
            const vh = window.innerHeight;
            const vw = window.innerWidth;

            const currentPaddingTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
            const panelHeight = Math.max(0, currentPaddingTop - BASE_PADDING_TOP);
            const targetCenterY = (vh + panelHeight) / 2;
            const dy = (rect.top + rect.height / 2) - targetCenterY;

            let dx = 0;
            if (rect.left < 0) dx = rect.left;
            else if (rect.right > vw) dx = rect.right - vw;

            return { dx, dy };
        }

        // Native `scrollBy({behavior:'smooth'})` doesn't expose a duration —
        // the browser just picks its own timing based on distance — so
        // there's no way to explicitly slow it down. This does the easing
        // manually instead, over a fixed, tunable duration.
        function animatedScrollBy(dx, dy, duration) {
            if (dx === 0 && dy === 0) return;
            const startX = window.scrollX;
            const startY = window.scrollY;
            const start = performance.now();

            function easeInOutQuad(t) {
                return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            }

            function step(now) {
                const t = Math.min(1, (now - start) / duration);
                const eased = easeInOutQuad(t);
                window.scrollTo(startX + dx * eased, startY + dy * eased);
                if (t < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        const SWITCH_SCROLL_MS = 500; // ~400ms native-smooth-scroll feel, slowed 25%

        // Smoothly scrolls an image to that same centered-below-panel point
        // — used when switching between images while the panel's already
        // open on mobile, where nothing is reflowing so there's no moving
        // target to chase frame-by-frame; a single eased scroll to the
        // computed target is enough.
        function scrollToPanelCenter(img) {
            const { dx, dy } = neededScrollDelta(img);
            animatedScrollBy(dx, dy, SWITCH_SCROLL_MS);
        }

        // While the panel is actually opening/closing, the gallery's layout
        // keeps reflowing continuously for the whole transition (body's
        // padding is animating), so a single delayed scroll would target a
        // position that's already stale by the time it fires. Instead this
        // nudges the scroll a fraction of the way toward "in view" every
        // frame for the transition's duration — a full instant correction
        // each frame is what made it feel snappy, since it jumps the whole
        // distance in one go the moment the image goes out of view rather
        // than moving gradually the whole time. A guaranteed hard snap at
        // the very end (using the same shared delta calculation, rather
        // than the browser's own native centering) cleans up whatever small
        // residual is left from chasing a moving target with partial steps.
        function trackImageIntoView(img, duration) {
            const start = performance.now();
            const SMOOTHING = 0.25; // fraction of the remaining distance corrected per frame

            function step(now) {
                const { dx, dy } = neededScrollDelta(img);
                if (now - start < duration) {
                    if (dx !== 0 || dy !== 0) {
                        window.scrollBy(dx * SMOOTHING, dy * SMOOTHING);
                    }
                    requestAnimationFrame(step);
                } else {
                    if (dx !== 0 || dy !== 0) window.scrollBy(dx, dy);
                    pulseAttention(img);
                }
            }
            requestAnimationFrame(step);
        }

        // Pulls the name-tag straight out of an image's own tags by
        // position (the 2nd tag, index 1) rather than deriving it from the
        // display name — the JSON's tag ordering convention is reliable
        // enough to use directly, and sidesteps needing to strip
        // parenthetical qualifiers, regional-variant prefixes, "Mega ",
        // "G-Max ", etc. out of free-text names to reconstruct the same
        // value.
        function getNameTag(img) {
            const card = img.closest('.image-card');
            const tags = (card?.dataset.tags || '').trim().split(/\s+/);
            return (tags[1] || '').toLowerCase();
        }

        // Pulls the numeric stage out of an image's "stageX" tag, if it has
        // one — used purely for sorting the related set below. Entries
        // without a recognizable stage tag sort to the end rather than
        // being dropped or throwing.
        function getStageRank(img) {
            const card = img.closest('.image-card');
            const tags = (card?.dataset.tags || '').toLowerCase().split(/\s+/);
            const stageTag = tags.find(t => /^stage\d+$/.test(t));
            return stageTag ? parseInt(stageTag.slice(5), 10) : Infinity;
        }

        // Every gallery image (regardless of current filters) that carries
        // this image's own name-tag — including the image itself, since its
        // own tags trivially include its own name-tag — sorted left-to-right
        // by stage (stage1, stage2, ...). Any entry whose tags don't follow
        // the expected ordering will simply turn up no related images rather
        // than erroring.
        function getRelatedImages(img) {
            const nameTag = getNameTag(img);
            if (!nameTag) return [];
            const matches = Array.from(document.querySelectorAll('.image-card img')).filter(other => {
                const tags = (other.closest('.image-card').dataset.tags || '').toLowerCase().split(/\s+/);
                return tags.includes(nameTag);
            });
            // Explicit index tie-break keeps entries sharing a stage (or
            // both lacking one) in their original gallery order, rather
            // than relying on sort() being stable.
            return matches
                .map((el, index) => ({ el, index, rank: getStageRank(el) }))
                .sort((a, b) => a.rank - b.rank || a.index - b.index)
                .map(x => x.el);
        }

        // ---- PokeAPI-powered "General Information" panel ----------------
        //
        // Each gallery image carries its National Dex number in
        // img.dataset.dex (set at card-creation time above). That number is
        // enough to reliably pull species-level data (Pokédex flavor text,
        // genus) straight from PokeAPI. Form-specific data (height, weight,
        // types, abilities) needs the right *slug* though — e.g. "Mega
        // Charizard X" is "charizard-mega-x", "Alolan Vulpix" is
        // "vulpix-alola" — so buildSlugCandidates() guesses a handful of
        // likely slugs from the display name and they're tried in order,
        // falling back to the base species entry if none of them exist.
        //
        // Results are cached per Pokémon name so flipping back and forth
        // (prev/next, evolution-chain thumbnails) never re-fetches.

        const pokeInfoCache = new Map(); // name -> rendered HTML string
        let pokeInfoRequestToken = 0;    // guards against slow fetches finishing out of order

        // Manually-curated Pokédex text for specific forms/varieties.
        //
        // PokeAPI's flavor text is stored per species+version only — it has
        // no field saying which form a given game's entry describes, so
        // form-specific text (Mega Evolutions, Gigantamax, and some
        // regional forms) can't be pulled out reliably by code. This map is
        // the manual fix: when a Pokémon's exact display name (matching
        // pokemon-data.json's "name" field) appears here, its entries are
        // shown instead of anything guessed from the API. This entirely
        // replaces the API-derived flavor section for that name; every
        // other field (types, height, weight, abilities, genus) still
        // comes from the API as normal.
        //
        // Loaded from flavor-overrides.json, a sibling file in the same
        // repo — see that file for the expected shape and instructions on
        // adding entries. Starts empty and fills in once the fetch below
        // resolves; if it's still empty (or fails to load) by the time
        // someone opens a Pokémon, that entry just falls back to
        // API-derived text as normal, so this fetch never blocks anything.
        let FLAVOR_TEXT_OVERRIDES = {};
        fetch("https://raw.githubusercontent.com/pmtupokedex/PMTU-Searchable-Pokedex/main/flavor-overrides.json")
            .then(response => response.json())
            .then(data => {
                FLAVOR_TEXT_OVERRIDES = data;
                // In case someone opened a Pokémon before this finished
                // loading (unlikely, but possible on a very fast click),
                // clear the cache so its info panel picks up the override
                // next time it's opened instead of staying stuck without it.
                pokeInfoCache.clear();
            })
            .catch(() => {
                // Overrides are optional — if the file is missing or fails
                // to load, the info panel just uses API-derived text for
                // every Pokémon, same as before this file existed.
            });

        const POKEAPI_SLUG_OVERRIDES = {
            "farfetch'd": "farfetchd",
            "galarian farfetch'd": "farfetchd-galar",
            "mr. mime": "mr-mime",
            "galarian mr. mime": "mr-mime-galar",
            "mime jr.": "mime-jr",
            "paldean tauros - combat": "tauros-paldea-combat-breed",
            "paldean tauros - blaze": "tauros-paldea-blaze-breed",
            "paldean tauros - aqua": "tauros-paldea-aqua-breed",
        };

        const POKEAPI_REGION_PREFIXES = {
            'alolan': 'alola',
            'galarian': 'galar',
            'hisuian': 'hisui',
            'paldean': 'paldea',
        };

        function slugify(str) {
            return str
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // strip accents (Flabébé, etc.)
                .replace(/['.]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // Returns an ordered list of slugs worth trying against
        // /api/v2/pokemon/{slug}, most-likely-correct first.
        // Parses out the structural pieces of a display name once, so both
        // buildSlugCandidates (below) and detectFormInfo (further down, used
        // for flavor-text filtering) work from the same understanding of
        // "what kind of form is this" instead of two separate regex passes
        // that could quietly drift out of sync with each other.
        function parseFormName(rawName) {
            // Strip a leading parenthetical note like "(Shiny) ".
            let working = rawName.replace(/^\([^)]*\)\s*/, '').trim();

            // Trailing parenthetical, e.g. "Ogerpon (Wellspring Mask)",
            // "Giratina (Origin Forme)".
            let base = working;
            let parenSuffix = null;
            const parenMatch = working.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
            if (parenMatch) {
                base = parenMatch[1].trim();
                parenSuffix = parenMatch[2].trim();
            }

            // Dash-separated form, e.g. "Paldean Tauros - Combat".
            let dashSuffix = null;
            const dashMatch = base.match(/^(.*?)\s+-\s+(.+)$/);
            if (dashMatch) {
                base = dashMatch[1].trim();
                dashSuffix = dashMatch[2].trim();
            }

            // Regional-form prefix, e.g. "Alolan Vulpix".
            let region = null;
            let core = base;
            for (const prefix in POKEAPI_REGION_PREFIXES) {
                const re = new RegExp('^' + prefix + '\\s+', 'i');
                if (re.test(core)) {
                    region = POKEAPI_REGION_PREFIXES[prefix];
                    core = core.replace(re, '').trim();
                    break;
                }
            }

            // Mega / Mega X / Mega Y, e.g. "Mega Charizard X".
            let megaSuffix = null;
            if (/^mega\s+/i.test(core)) {
                let rest = core.replace(/^mega\s+/i, '').trim();
                const xyMatch = rest.match(/^(.*)\s+([XY])$/);
                if (xyMatch) {
                    core = xyMatch[1].trim();
                    megaSuffix = 'mega-' + xyMatch[2].toLowerCase();
                } else {
                    core = rest;
                    megaSuffix = 'mega';
                }
            }

            // Gigantamax, e.g. "G-Max Charizard".
            let isGmax = false;
            if (/^g-?max\s+/i.test(core)) {
                core = core.replace(/^g-?max\s+/i, '').trim();
                isGmax = true;
            }

            return { core, region, megaSuffix, isGmax, parenSuffix, dashSuffix };
        }

        function buildSlugCandidates(rawName) {
            const candidates = [];
            const add = (s) => { if (s && !candidates.includes(s)) candidates.push(s); };

            const lower = rawName.trim().toLowerCase();
            if (POKEAPI_SLUG_OVERRIDES[lower]) add(POKEAPI_SLUG_OVERRIDES[lower]);

            const { core, region, megaSuffix, isGmax, parenSuffix, dashSuffix } = parseFormName(rawName);

            const coreSlug = slugify(core);
            if (megaSuffix) add(coreSlug + '-' + megaSuffix);
            if (isGmax) add(coreSlug + '-gmax');
            if (region) add(coreSlug + '-' + region);
            if (parenSuffix) add(coreSlug + '-' + slugify(parenSuffix));
            if (dashSuffix) add(coreSlug + '-' + slugify(dashSuffix));
            add(coreSlug);
            add(slugify(rawName)); // last-resort literal slugify of the whole name

            return candidates;
        }

        // Boils a display name down to "what kind of form is this" —
        // 'mega', 'gmax', 'region' (with which region), or 'base' — used to
        // decide how to filter/annotate Pokédex flavor text below. PokéAPI
        // doesn't tag flavor text by form (see buildPokemonInfoHTML), so
        // this is the closest we can get without that data existing.
        function detectFormInfo(rawName) {
            const { region, megaSuffix, isGmax } = parseFormName(rawName);
            if (megaSuffix) return { kind: 'mega', region: null };
            if (isGmax) return { kind: 'gmax', region: null };
            if (region) return { kind: 'region', region };
            return { kind: 'base', region: null };
        }

        // Game versions belonging to each region — used to narrow down
        // which flavor-text entries are plausible for a regional form. Not
        // perfect: a handful of these games let you obtain *both* the
        // original and regional form in the same Pokédex, so an entry for
        // the wrong one can still slip through (see the form note rendered
        // alongside filtered results in buildPokemonInfoHTML).
        const REGION_VERSIONS = {
            alola:  ['sun', 'moon', 'ultra-sun', 'ultra-moon', 'lets-go-pikachu', 'lets-go-eevee'],
            galar:  ['sword', 'shield'],
            hisui:  ['legends-arceus'],
            paldea: ['scarlet', 'violet'],
        };

        const VERSION_NAME_OVERRIDES = {
            'lets-go-pikachu': "Let's Go, Pikachu!",
            'lets-go-eevee': "Let's Go, Eevee!",
            'legends-arceus': 'Legends: Arceus',
        };

        function formatVersionName(v) {
            if (VERSION_NAME_OVERRIDES[v]) return VERSION_NAME_OVERRIDES[v];
            return v.split('-').map(w => /^\d+$/.test(w) ? w : capitalize(w)).join(' ');
        }

        // Collapses flavor-text entries that share identical wording (very
        // common across paired versions, e.g. Red & Blue) into one row
        // listing every version it appeared in, instead of repeating the
        // same paragraph over and over.
        function groupFlavorEntries(entries) {
            const map = new Map(); // text -> [version names]
            entries.forEach(e => {
                const text = e.flavor_text.replace(/[\n\f\u000c]/g, ' ').trim();
                if (!map.has(text)) map.set(text, []);
                map.get(text).push(e.version.name);
            });
            return Array.from(map.entries()).map(([text, versions]) => ({ text, versions }));
        }

        async function tryFetchJson(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                return await res.json();
            } catch (err) {
                return null;
            }
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // Tags that represent this board game's special "abilities" —
        // pulled straight from pokemon-data.json instead of PokeAPI, since
        // this variant's ability list doesn't match the main series games.
        const ABILITY_TAGS = ['dig', 'fly', 'surf', 'teleport'];

        async function buildPokemonInfoHTML(name, dexRaw, tagsRaw) {
            const dex = /^\d+$/.test(dexRaw) ? parseInt(dexRaw, 10) : null;

            const presentAbilityTags = (tagsRaw || '')
                .toLowerCase()
                .split(/\s+/)
                .filter(t => ABILITY_TAGS.includes(t));
            const abilitiesStr = presentAbilityTags.length > 0
                ? presentAbilityTags.map(capitalize).join(', ')
                : 'No Ability';

            // "???" (MissingNo) and "PS#" (Pokéstar Studios) entries aren't
            // real Pokédex numbers — nothing to look up.
            if (dex === null) {
                return `<div class="poke-info-unavailable"><strong>${escapeHtml(name)}</strong><br>`
                    + `This entry isn't part of the official Pokédex, so live data isn't available.</div>`;
            }

            const slugCandidates = buildSlugCandidates(name);
            let pokemonData = null;
            for (const slug of slugCandidates) {
                pokemonData = await tryFetchJson(`https://pokeapi.co/api/v2/pokemon/${slug}`);
                if (pokemonData) break;
            }
            // Fall back to the base/default form for that Dex number if none
            // of the guessed form slugs exist.
            if (!pokemonData) {
                pokemonData = await tryFetchJson(`https://pokeapi.co/api/v2/pokemon/${dex}`);
            }

            const speciesData = await tryFetchJson(`https://pokeapi.co/api/v2/pokemon-species/${dex}`);

            if (!pokemonData && !speciesData) {
                return `<div class="poke-info-unavailable"><strong>${escapeHtml(name)}</strong><br>`
                    + `Couldn't load Pokédex data right now — check your connection and try again.</div>`;
            }

            let genus = '';
            let flavorSectionHtml = '';

            const overrideEntries = FLAVOR_TEXT_OVERRIDES[name];
            if (overrideEntries && overrideEntries.length > 0) {
                const entriesHtml = overrideEntries.map(e => `
                    <div class="poke-info-flavor-entry">
                        <div class="poke-info-flavor-version">${escapeHtml(e.version)}</div>
                        <div class="poke-info-flavor-text">${escapeHtml(e.text)}</div>
                    </div>
                `).join('');
                flavorSectionHtml = `<div class="poke-info-flavor-section">${entriesHtml}</div>`;
            }

            if (speciesData) {
                const genusEntry = (speciesData.genera || []).find(g => g.language.name === 'en');
                genus = genusEntry ? genusEntry.genus : '';
            }

            if (!flavorSectionHtml && speciesData) {
                const englishEntries = (speciesData.flavor_text_entries || []).filter(f => f.language.name === 'en');
                const grouped = groupFlavorEntries(englishEntries);
                const formInfo = detectFormInfo(name);

                let relevantGroups = grouped;
                let formNote = '';

                if (formInfo.kind === 'region' && REGION_VERSIONS[formInfo.region]) {
                    const allowedVersions = REGION_VERSIONS[formInfo.region];
                    const filtered = grouped.filter(g => g.versions.some(v => allowedVersions.includes(v)));
                    // Only apply the filter if it actually left something —
                    // an empty result means our version list missed this
                    // Pokémon's games, and showing nothing would be worse
                    // than showing the unfiltered list.
                    if (filtered.length > 0) {
                        relevantGroups = filtered;
                        formNote = `Showing entries from games featuring the ${capitalize(formInfo.region)}n form. `
                            + `PokéAPI doesn't label entries by form, so if a game let you catch both forms, `
                            + `an entry for the original form may still appear below.`;
                    }
                } else if (formInfo.kind === 'mega' || formInfo.kind === 'gmax') {
                    formNote = `PokéAPI doesn't expose separate Pokédex text for `
                        + `${formInfo.kind === 'mega' ? 'Mega Evolutions' : 'Gigantamax forms'} — `
                        + `showing ${escapeHtml(genus ? 'the species\u2019' : 'this species\u2019')} standard entries instead.`;
                }

                if (relevantGroups.length > 0) {
                    const entriesHtml = relevantGroups.map(g => `
                        <div class="poke-info-flavor-entry">
                            <div class="poke-info-flavor-version">${g.versions.map(formatVersionName).join(' / ')}</div>
                            <div class="poke-info-flavor-text">${escapeHtml(g.text)}</div>
                        </div>
                    `).join('');
                    flavorSectionHtml = `
                        <div class="poke-info-flavor-section">
                            ${formNote ? `<div class="poke-info-form-note">${formNote}</div>` : ''}
                            ${entriesHtml}
                        </div>
                    `;
                }
            }

            let typesHtml = '', heightStr = '', weightStr = '', cryUrl = '';
            if (pokemonData) {
                typesHtml = pokemonData.types
                    .map(t => `<span class="poke-type-badge poke-type-${t.type.name}">${capitalize(t.type.name)}</span>`)
                    .join(' ');
                heightStr = (pokemonData.height / 10).toFixed(1) + ' m';
                weightStr = (pokemonData.weight / 10).toFixed(1) + ' kg';
                // "latest" is the modern re-recorded cry; "legacy" is the
                // older Gen 1-5 style one. Prefer latest, fall back to
                // legacy for the odd entry that's missing one or the other.
                cryUrl = (pokemonData.cries && (pokemonData.cries.latest || pokemonData.cries.legacy)) || '';
            }

            return `
                <div class="poke-info-header">
                    <span class="poke-info-name-group">
                        <span class="poke-info-name">${escapeHtml(name)}</span>
                        ${cryUrl ? `<button class="poke-info-cry-btn" data-cry-url="${escapeHtml(cryUrl)}" title="Play cry">▶ CRY</button>` : ''}
                    </span>
                    <span class="poke-info-dex">#${String(dex).padStart(3, '0')}</span>
                </div>
                ${genus ? `<div class="poke-info-genus">${escapeHtml(genus)}</div>` : ''}
                ${typesHtml ? `<div class="poke-info-row"><span class="poke-info-label">Type</span>${typesHtml}</div>` : ''}
                ${heightStr ? `<div class="poke-info-row"><span class="poke-info-label">Height</span>${heightStr}</div>` : ''}
                ${weightStr ? `<div class="poke-info-row"><span class="poke-info-label">Weight</span>${weightStr}</div>` : ''}
                ${abilitiesStr ? `<div class="poke-info-row"><span class="poke-info-label">Abilities</span>${abilitiesStr}</div>` : ''}
                ${flavorSectionHtml}
            `;
        }

        // Plays whatever cry belongs to the Pokémon currently rendered in
        // the info panel, if it has one. Reads it back off the just-
        // rendered "Cry" button's data-cry-url rather than threading the
        // URL through separately, so this always matches what's on screen.
        function playCurrentCry() {
            const btn = viewerInfoContent.querySelector('.poke-info-cry-btn');
            if (!btn || !btn.dataset.cryUrl) return;
            cryAudio.src = btn.dataset.cryUrl;
            cryAudio.currentTime = 0;
            cryAudio.play().catch(() => { /* autoplay blocked or file missing — silently skip */ });
        }

        async function loadPokemonInfo(galleryImg) {
            const name = galleryImg.alt;
            const dexRaw = galleryImg.dataset.dex || '';
            const tagsRaw = galleryImg.closest('.image-card')?.dataset.tags || '';
            const token = ++pokeInfoRequestToken;

            if (pokeInfoCache.has(name)) {
                viewerInfoContent.innerHTML = pokeInfoCache.get(name);
                playCurrentCry();
                return;
            }

            viewerInfoContent.innerHTML = '<div class="poke-info-loading">Loading Pokédex data…</div>';

            const html = await buildPokemonInfoHTML(name, dexRaw, tagsRaw);
            pokeInfoCache.set(name, html);

            // If the user has since opened a different Pokémon, don't let
            // this slower/older fetch clobber what's now showing (or play
            // the wrong cry over top of whatever's now displayed).
            if (token === pokeInfoRequestToken) {
                viewerInfoContent.innerHTML = html;
                playCurrentCry();
            }
        }

        function renderRelatedImages(img) {
            const related = getRelatedImages(img);
            viewerRelatedGrid.innerHTML = '';
            if (related.length === 0) {
                const empty = document.createElement('div');
                empty.id = 'viewer-related-empty';
                empty.textContent = 'No related images found.';
                viewerRelatedGrid.appendChild(empty);
                return;
            }
            let activeThumb = null;
            related.forEach(relImg => {
                const thumb = document.createElement('img');
                thumb.src = relImg.src;
                thumb.alt = relImg.alt;
                thumb.draggable = false; // avoid native drag-ghost fighting with the click-and-drag panning below

                // Mirrors .image-card .hit-zone in the main gallery: owns
                // both the click and the hover state (via CSS :has, see
                // .related-thumb-wrap:has(.related-hit-zone:hover)), clipped
                // to a circle matching the visible artwork rather than the
                // img's full square box.
                const hitZone = document.createElement('div');
                hitZone.className = 'related-hit-zone';
                hitZone.addEventListener('click', (e) => {
                    // Stops here rather than relying on a closest() check
                    // in the overlay's click-outside-closes listener: this
                    // click also rebuilds the related grid's contents
                    // (renderRelatedImages, called from openImageViewer),
                    // which detaches this very element from the DOM before
                    // the event finishes bubbling — a detached node has no
                    // ancestors left to match against.
                    e.stopPropagation();
                    openImageViewer(relImg);
                });

                const wrap = document.createElement('div');
                wrap.className = 'related-thumb-wrap';
                wrap.appendChild(thumb);
                wrap.appendChild(hitZone);
                if (relImg === img) {
                    // Lives on the wrapper, not the img — see the CSS
                    // comments on .related-thumb-wrap.related-active /
                    // .gallery-pulse for why.
                    wrap.classList.add('related-active', 'gallery-pulse');
                    activeThumb = wrap;
                }
                viewerRelatedGrid.appendChild(wrap);
            });

            // Keeps the active thumbnail in view within the row's own
            // horizontal scroll whenever selection changes — including via
            // the prev/next buttons, since those funnel through
            // openImageViewer -> renderRelatedImages same as everything
            // else. 'nearest' on the block axis avoids nudging the page's
            // own vertical scroll, which is handled separately.
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        // Mouse wheels only scroll vertically by default, which does
        // nothing useful on a row that only overflows horizontally — this
        // redirects that same vertical input (or a trackpad's horizontal
        // delta, whichever is nonzero) into scrollLeft instead. Only
        // hijacks the wheel when there's actually overflow to scroll
        // through, so it doesn't swallow page scrolling once the row fits
        // entirely within the section.
        viewerRelatedGrid.addEventListener('wheel', (e) => {
            if (viewerRelatedGrid.scrollWidth <= viewerRelatedGrid.clientWidth) return;
            e.preventDefault();
            viewerRelatedGrid.scrollLeft += (e.deltaY !== 0 ? e.deltaY : e.deltaX);
        }, { passive: false });

        // Click-and-drag panning, mouse/pen only — touch is skipped
        // entirely so the browser's own native touch-scroll (already
        // enabled by overflow-x: auto) handles that case instead; running
        // both at once would have them fighting over the same gesture.
        let relatedDragActive = false;
        let relatedDragMoved = false;
        let relatedDragStartX = 0;
        let relatedDragStartScrollLeft = 0;
        let relatedDragPointerId = null;

        viewerRelatedGrid.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch') return;
            relatedDragActive = true;
            relatedDragMoved = false;
            relatedDragStartX = e.clientX;
            relatedDragStartScrollLeft = viewerRelatedGrid.scrollLeft;
            relatedDragPointerId = e.pointerId;
            // Capture is NOT taken here — see pointermove below for why.
        });

        viewerRelatedGrid.addEventListener('pointermove', (e) => {
            if (!relatedDragActive) return;
            const dx = e.clientX - relatedDragStartX;
            // Small threshold before counting this as a real drag, so an
            // ordinary click (which always jitters the pointer a pixel or
            // two) doesn't get mistaken for one and lose its click below.
            if (!relatedDragMoved && Math.abs(dx) > 3) {
                relatedDragMoved = true;
                viewerRelatedGrid.classList.add('dragging');
                // Only capture once we know this is a genuine drag, not on
                // every pointerdown. In Chromium (Edge included),
                // setPointerCapture also redirects the eventual synthesized
                // click event's target to the capturing element — capturing
                // on every press meant even a plain click on a thumbnail
                // was retargeted to this container instead of the <img>,
                // so the thumbnail's own click listener never ran and the
                // click bubbled untouched to the overlay's
                // click-outside-closes handler, closing the whole panel.
                viewerRelatedGrid.setPointerCapture(relatedDragPointerId);
            }
            if (relatedDragMoved) {
                viewerRelatedGrid.scrollLeft = relatedDragStartScrollLeft - dx;
            }
        });

        function endRelatedDrag(e) {
            relatedDragActive = false;
            viewerRelatedGrid.classList.remove('dragging');
            if (relatedDragMoved && viewerRelatedGrid.hasPointerCapture?.(relatedDragPointerId)) {
                viewerRelatedGrid.releasePointerCapture(relatedDragPointerId);
            }
        }
        viewerRelatedGrid.addEventListener('pointerup', endRelatedDrag);
        viewerRelatedGrid.addEventListener('pointercancel', endRelatedDrag);
        viewerRelatedGrid.addEventListener('pointerleave', endRelatedDrag);

        // A drag release still fires a click on whatever thumbnail is
        // under the pointer — without this, dragging the row would also
        // randomly open whatever image you happened to let go over.
        // Capture phase so this runs before each thumbnail's own click
        // listener (added in renderRelatedImages above).
        viewerRelatedGrid.addEventListener('click', (e) => {
            if (relatedDragMoved) {
                e.stopImmediatePropagation();
                e.preventDefault();
                relatedDragMoved = false;
            }
        }, true);

        // Tracks which of the two collapsible sections (if either) is open
        // — null, 'info', or 'related'. Only one is ever expanded at once,
        // on both mobile and desktop, since they share the same panel-
        // growth CSS (#image-overlay.info-expanded / .related-expanded)
        // and there isn't room to show both meaningfully at the same time.
        let expandedPanel = null;

        function setExpandedPanel(panel) {
            // Clicking the toggle for whichever section is already open
            // closes it; clicking the other one's toggle switches straight
            // to it (no need to close-then-reopen as two separate clicks).
            expandedPanel = (expandedPanel === panel) ? null : panel;

            const infoOpen = expandedPanel === 'info';
            const relatedOpen = expandedPanel === 'related';

            imageOverlay.classList.toggle('info-expanded', infoOpen);
            imageOverlay.classList.toggle('related-expanded', relatedOpen);
            document.body.classList.toggle('info-expanded', infoOpen);
            document.body.classList.toggle('related-expanded', relatedOpen);

            viewerInfoToggle.setAttribute('aria-expanded', String(infoOpen));
            viewerInfoToggle.textContent = infoOpen ? '▾ GENERAL INFORMATION' : '▸ GENERAL INFORMATION';
            viewerRelatedToggle.setAttribute('aria-expanded', String(relatedOpen));
            viewerRelatedToggle.textContent = relatedOpen ? '▾ EVOLUTION CHAIN / FORMS' : '▸ EVOLUTION CHAIN / FORMS';

            // Reuses the same brief transition-enabling window as open/close
            // so the gallery's reserved space grows/shrinks smoothly instead
            // of snapping, and re-tracks the active image into its new
            // centered position now that the available space has changed.
            beginPanelAnim();
            if (activeGalleryImg) {
                trackImageIntoView(activeGalleryImg, PANEL_TRANSITION_MS);
            }
        }

        viewerInfoToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            setExpandedPanel('info');
        });

        viewerRelatedToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            setExpandedPanel('related');
        });

        function openImageViewer(galleryImg) {
            const alreadyOpen = document.body.classList.contains('viewer-open');

            if (activeGalleryImg) {
                activeGalleryImg.closest('.image-card')?.classList.remove('active-in-viewer');
            }
            activeGalleryImg = galleryImg;
            galleryImg.closest('.image-card')?.classList.add('active-in-viewer');

            overlayImg.src = galleryImg.src;
            overlayImg.alt = galleryImg.alt;
            imageOverlay.classList.add('visible');
            beginPanelAnim();
            document.body.classList.add('viewer-open');

            closeFilterPanel();
            renderRelatedImages(galleryImg);
            loadPokemonInfo(galleryImg);

            if (alreadyOpen) {
                // Panel's already open, just switching images — nothing is
                // reflowing, so there's no moving target to chase.
                if (desktopFilterQuery.matches) {
                    // Desktop: panel docks left and never covers vertical
                    // space, so an ordinary smooth scroll is enough.
                    galleryImg.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                } else {
                    // Mobile: smoothly scroll to the same centered-below-panel
                    // point used when first opening, instead of the
                    // browser's native "nearest edge" behavior.
                    scrollToPanelCenter(galleryImg);
                }
                // Pulse right away regardless of whether anything actually
                // needed to scroll — tapping a different thumbnail should
                // always give a bit of tactile feedback that the magnified
                // view updated.
                pulseAttention(galleryImg);
            } else {
                trackImageIntoView(galleryImg, PANEL_TRANSITION_MS);
                if (!desktopFilterQuery.matches) {
                    // Mobile viewer now opens fullscreen (see #image-overlay's
                    // mobile height rule), so default straight into General
                    // Information instead of requiring an extra tap first —
                    // matches the filter panel already opening fullscreen on
                    // mobile. Desktop leaves both sections collapsed, same
                    // as before.
                    setExpandedPanel('info');
                }
            }
        }

        function closeImageViewer() {
            const wasOpen = document.body.classList.contains('viewer-open');
            const previouslyActive = activeGalleryImg;

            if (activeGalleryImg) {
                activeGalleryImg.closest('.image-card')?.classList.remove('active-in-viewer');
                activeGalleryImg = null;
            }

            imageOverlay.classList.remove('visible');
            overlayImg.src = "";
            beginPanelAnim();
            document.body.classList.remove('viewer-open');

            expandedPanel = null;
            imageOverlay.classList.remove('related-expanded', 'info-expanded');
            document.body.classList.remove('related-expanded', 'info-expanded');
            viewerInfoToggle.setAttribute('aria-expanded', 'false');
            viewerInfoToggle.textContent = '▸ GENERAL INFORMATION';
            viewerRelatedToggle.setAttribute('aria-expanded', 'false');
            viewerRelatedToggle.textContent = '▸ EVOLUTION CHAIN / FORMS';

            // Always re-center on close, on both mobile and desktop — this
            // is also what makes the pulse afterward land in a consistent,
            // predictable spot rather than only sometimes appearing.
            if (previouslyActive && wasOpen) {
                trackImageIntoView(previouslyActive, PANEL_TRANSITION_MS);
            }
        }

        // Currently-filtered images in gallery order — prev/next only ever
        // steps through what's actually visible under the active filters,
        // not the full unfiltered set.
        function getVisibleGalleryImages() {
            return Array.from(document.querySelectorAll('.image-card.show img'));
        }

        // Wraps around at either end rather than stopping dead, since these
        // buttons give no visual indication of "first"/"last" to justify a
        // dead click.
        function navigateImage(direction) {
            const visible = getVisibleGalleryImages();
            if (visible.length < 2) return;
            const currentIndex = visible.indexOf(activeGalleryImg);
            if (currentIndex === -1) return;
            const nextIndex = (currentIndex + direction + visible.length) % visible.length;
            openImageViewer(visible[nextIndex]);
        }

        // Closing on an "outside" click is handled entirely by the
        // gallery's own listener below (empty gallery background = click
        // outside the panel). There used to also be a listener here on
        // #image-overlay itself, closing on any click that wasn't
        // specifically the image or nav/close buttons — but since the
        // panel now has real interactive sections of its own (toggle row,
        // General Information, Evolution Chain), that caught clicks on
        // their empty background too, closing the whole viewer when
        // clicking blank space *inside* the panel rather than outside it.
        // Removed rather than special-cased further, since closing on
        // outside-click was never meant to reach inside the panel at all.

        imageCloseBtn.addEventListener('click', closeImageViewer);

        imagePrevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            pulseNavArrow(imagePrevArrow);
            navigateImage(-1);
        });

        imageNextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            pulseNavArrow(imageNextArrow);
            navigateImage(1);
        });

        // Clicking genuinely empty space — the gallery's own background,
        // bare body, or the transparent/edge slivers of a gallery image
        // (see attachImageEvents) — closes whichever of these happens to
        // be open. Both close functions already no-op safely if their
        // panel isn't open, so it's fine to call both unconditionally
        // rather than tracking which one to target.
        function closeOpenPanels() {
            closeImageViewer();
            closeFilterPanel();
        }

        // Clicking empty space in the gallery (not on a card/image) closes
        // the magnify panel if it's open.
        gallery.addEventListener('click', (e) => {
            if (e.target === gallery) closeOpenPanels();
        });

        // The listener above only ever fires for clicks landing inside
        // gallery's own box — but the reflow math that reserves space for
        // the docked panel (body's padding-left on desktop, padding-top on
        // mobile) is a separate calc() expression from the panel's own
        // width/height formula. The two are meant to match exactly, but
        // being resolved independently they can drift by a pixel or two,
        // leaving a thin seam where neither the panel nor the gallery
        // actually covers — body's own background shows through there
        // instead, and a click on it never reaches the gallery listener
        // since gallery isn't an ancestor of body. Catching a direct click
        // on body itself closes the panel from that seam too, without
        // needing to chase down and eliminate every such rounding gap.
        document.body.addEventListener('click', (e) => {
            if (e.target === document.body) closeOpenPanels();
        });

        document.querySelectorAll('.filter-section-header').forEach(header => {
            header.classList.add('collapsed');
            if (header.nextElementSibling) {
                header.nextElementSibling.style.display = 'none';
            }
            header.addEventListener('click', () => {
                header.classList.toggle('collapsed');
                const section = header.nextElementSibling;
                if (section) {
                    section.style.display = header.classList.contains('collapsed') ? 'none' : '';
                }
            });
        });

        document.querySelectorAll('.specific-region-header').forEach(header => {
            header.classList.add('collapsed');
            let sibling = header.nextElementSibling;
            while (sibling) {
                sibling.style.display = 'none';
                sibling = sibling.nextElementSibling;
            }
            header.addEventListener('click', () => {
                header.classList.toggle('collapsed');
                const collapsed = header.classList.contains('collapsed');
                let sib = header.nextElementSibling;
                while (sib) {
                    sib.style.display = collapsed ? 'none' : '';
                    sib = sib.nextElementSibling;
                }
            });
        });

        filterGallery();

    </script>
</body>
</html>
