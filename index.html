<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMTU Searchable Pokédex</title>
    <style>
        * { box-sizing: border-box; }

        /* Kills the browser's default blue/gray flash on tap (mobile
           Safari/Chrome) for every element at once, rather than chasing it
           down on individual clickable zones one at a time. It was always
           there on the nav buttons and the panel-4 click zone -- it just
           used to be hidden under the nav buttons' gradient scrim and
           whatever background panel-4 has, and only became visible once
           those stopped covering it. Only affects the transient touch
           highlight, not keyboard focus outlines, so this doesn't touch
           accessibility. */
        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/ofvdv0ay6z4wufs1nrspd/Pokedex-Background-3.png?rlkey=kwi0c2v6iypgmvryqebwm2cgx&st=bddxb3ed&dl=1"), url("https://dl.dropboxusercontent.com/scl/fi/69r50xq69bcoqo8tz2t1u/Pokedex-Background-5.png?rlkey=bxkj5vbeac840vu82rkqg61n3&st=xe9cj7yc&dl=1");
            background-size: 100% 100%, 240px 240px;
            background-position: center, center;
		background-repeat: no-repeat, repeat;
            background-attachment: fixed;
		background-blend-mode: multiply;
        }

        /* Custom scrollbars — a thin, semi-transparent dark pill rather
           than each browser's chunky default, so they read as part of the
           page's own design instead of an OS-level UI element sitting on
           top of it. Covers the filter panel's own scroll, the
           related-images row's horizontal scroll, and the general-info
           panel's scroll. html (the page's own root scrollbar) is kept
           thin to match but deliberately left uncolored below — its
           "transparent" track doesn't actually reveal <body>'s decorative
           background the way it does for these other three (this
           scrollbar sits on <html>'s own plain canvas instead), so
           coloring it ended up looking like a flat tinted box rather than
           blending with the page; thin-but-native reads better here than
           that did. Split into two syntaxes since there's no single
           standard yet: Firefox uses the scrollbar-width/-color
           properties, while Chromium and Safari use the older
           ::-webkit-scrollbar pseudo-elements — browsers ignore whichever
           one they don't implement, so both are safe to include
           unconditionally. Mobile browsers' overlay scrollbars ignore both
           entirely (they're not a box with a track/thumb to style), so
           this needs no mobile/desktop media guard of its own. */
        html {
            scrollbar-width: thin;
        }

        html::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        #filter-scroll,
        #viewer-related-grid,
        #viewer-info-content {
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,0.35) transparent;
        }

        #filter-scroll::-webkit-scrollbar,
        #viewer-related-grid::-webkit-scrollbar,
        #viewer-info-content::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        #filter-scroll::-webkit-scrollbar-track,
        #viewer-related-grid::-webkit-scrollbar-track,
        #viewer-info-content::-webkit-scrollbar-track {
            background: transparent;
        }

        #filter-scroll::-webkit-scrollbar-thumb,
        #viewer-related-grid::-webkit-scrollbar-thumb,
        #viewer-info-content::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.35);
            border-radius: 10px;
            /* A transparent border with background-clip: padding-box makes
               the thumb paint inset from the scrollbar's own edges, so it
               reads as a slim rounded pill floating in its track instead of
               a flat bar spanning edge-to-edge. */
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        #filter-scroll::-webkit-scrollbar-thumb:hover,
        #viewer-related-grid::-webkit-scrollbar-thumb:hover,
        #viewer-info-content::-webkit-scrollbar-thumb:hover {
            background-color: rgba(0,0,0,0.55);
        }

        /* The padding transition only applies during this short window,
           added right when a panel actually opens/closes and removed a
           beat later (see beginPanelAnim() in the script). Keeping it off
           the rest of the time matters: body's padding is also driven by
           a clamp()/vw-based formula while a panel is open, which
           recalculates continuously as the window is resized — an
           unconditional transition would smooth those resize-driven
           changes too, creating a lag between the gallery's actual
           available width and the true current window width. That lag is
           what caused the grid's column count to visibly snap to the next
           threshold and back while dragging the resize handle. */
        body.panel-animating {
            transition: padding 0.4375s ease; /* 0.35s base, slowed 25% */
        }

        /* Brief attention pulse, triggered once the scroll that follows an
           open/close settles, to draw the eye to the image's new position.
           Uses its own translateZ(0) layer-promotion (same trick as the
           base .image-card img rule) since this now animates the card
           itself rather than the img, so the img's own promotion doesn't
           cover it. */
        @keyframes gallery-pulse {
            0%   { transform: translateZ(0) scale(1); }
            35%  { transform: translateZ(0) scale(1.15); }
            65%  { transform: translateZ(0) scale(0.97); }
            100% { transform: translateZ(0) scale(1); }
        }

        /* Lives on the card itself rather than the img, so the whole
           frame+art unit pulses together instead of just the artwork
           inside it — same reasoning as .image-card.active-in-viewer
           further down. Composes fine with the hover-zoom rule despite
           both ultimately affecting the card's rendered size, since hover
           uses the standalone `scale` property while this uses `transform`
           — see the comment on .image-card for why that separation
           matters. */
        .image-card.gallery-pulse {
            animation: gallery-pulse 600ms ease-out;
        }

        /* Mobile/portrait: magnified view docks to the top and is
           fullscreen the moment it opens — mirroring how the filter panel
           already behaves on mobile (see #filter-panel) — rather than
           starting docked at a partial 60dvh and growing to fullscreen
           only once a collapsible section opened. That growth used to run
           at the same time as the ::before tile-scroll animation's own
           repainting, which is what caused the gallery to flicker through
           during the transition; a constant fullscreen height removes the
           competing layout change entirely. Desktop swaps this for
           padding-left (see the min-width:900px override below), since
           the panel docks to the left there instead. */
        body.viewer-open {
            padding-top: calc(20px + 100vh); /* fallback for browsers without dvh support */
            padding-top: calc(20px + 100dvh);
        }

        /* Buttons */
        #open-filters-btn, #open-pokedex-btn {
            position: fixed;
            bottom: 15px;
            background-color: #444;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 30px;
            font-size: 18px;
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        #open-filters-btn {
            right: 15px;
            z-index: 1000;
        }

        #open-pokedex-btn {
            left: 15px;
            z-index: 1000;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: none;
            z-index: 998;
        }
        #overlay.visible { display: block; }

        /* Loading splash: covers the whole page from the moment the HTML
           parses, so nothing underneath (background images, panels, etc.)
           is visible mid-load. The image fades in once it's actually
           loaded, holds for 5s, then the whole thing fades out to reveal
           the Pokédex panel. Sits above everything (including the
           Pokédex panel's click-zone) so it also blocks interaction while
           it's up — no extra JS needed for that, it's just on top. */
        #loading-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        #loading-splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-splash-img {
            /* 40vw scales the image with viewport width, which is exactly
               what we want up through a 16:9 aspect ratio — but on an
               ultrawide monitor, vw keeps growing relative to vh well past
               that point, over-scaling the image until it starts bleeding
               off the top/bottom of the screen. calc(40vh * 16 / 9) is
               "what 40vw would equal at exactly 16:9" expressed in vh
               instead — since vh doesn't grow with extra width, it acts as
               a hard ceiling once the viewport gets wider than 16:9,
               without changing anything for mobile through 16:9 (where
               40vw is always the smaller of the two already, so min()
               picks it unchanged). */
            width: min(40vw, calc(40vh * 16 / 9));
            min-width: 50vh;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #loading-splash-img.loaded {
            opacity: 1;
        }

	/* Filter Panel */
        #filter-panel {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 100vh; /* fallback for browsers without dvh support */
            height: 100dvh;
            background: #ffffff;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.25);
            transform: translateY(100%);
            transition: transform 0.35s ease;
            z-index: 999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .filter-panel-bg {
            position: absolute;
            inset: -10%;
            z-index: -1;
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/i5ailfuuue0yvimiunlmg/Pokedex-Background-4.png?rlkey=rf6sl73lckbwdvhxv2tr5hpim&st=u536e47a&dl=1"), url("https://dl.dropboxusercontent.com/scl/fi/8ewm1e8mibpfasdf8cezl/Pokedex-Background-5.png?rlkey=t1o2cmqmla0xwn2wq5p6l36dl&st=tmzvpi8o&dl=1");
            background-size: cover, 240px 240px;
            background-position: center, center;
		background-repeat: no-repeat, repeat;
		background-attachment: fixed;
		background-blend-mode: multiply;
        }

        #filter-panel.open {
            transform: translateY(0);
        }

        @media (min-width: 900px) {
            #filter-panel {
                left: auto;
                right: 0;
                top: 0;
                bottom: 0;
                width: 480px;
                max-width: 90vw;
                height: 100vh;
                min-height: 0;
                border-radius: 15px 0 0 15px;
                box-shadow: -4px 0 10px rgba(0,0,0,0.25);
                transform: translateX(100%);
            }

            #filter-panel.open {
                transform: translateX(0);
            }

            /* Desktop/landscape: instead of the panel overlaying the gallery
               (which is what #overlay's dimming was for), the gallery
               reserves space on the right equal to the panel's width and
               reflows into what's left — nothing gets covered, so no dimming
               is needed and the gallery stays fully interactive while the
               panel is open. #overlay is force-hidden here since it no
               longer serves a purpose at this breakpoint. */
            body.filters-open {
                padding-right: calc(20px + min(480px, 90vw));
            }

            /* Magnify panel docks left on desktop instead of top, so swap
               which side reserves space (and reset the mobile top rule).
               Must match the panel's own width formula exactly (see
               #image-overlay above) or the reserved space and the panel's
               actual width drift apart as the window is resized. */
            body.viewer-open {
                padding-top: 20px;
                padding-left: calc(20px + min(clamp(480px, 53vw, 100vh), 90vw)); /* fallback for browsers without dvh support */
                padding-left: calc(20px + min(clamp(480px, 53vw, 100dvh), 90vw));
            }

            #overlay {
                display: none !important;
            }

            /* Extra right padding versus the mobile default (20px 20px 15px)
               — desktop browsers reserve real layout width for the filter
               panel's own vertical scrollbar (#filter-scroll below), while
               mobile browsers almost universally use an overlay scrollbar
               that takes no space at all. Without this, the search input
               and its content visually crowd right up against the
               scrollbar on desktop. Applies to #filter-top specifically
               (not #filter-scroll, which already reserves its own space via
               scrollbar-gutter: stable on both) since #filter-top has no
               scrollbar of its own to naturally push its content over. */
            #filter-top {
                padding: 20px 35px 15px 20px;
            }
        }

        #filter-top {
            padding: 20px 20px 15px;
            border-bottom: 1px solid #ddd;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
            scrollbar-gutter: stable;
        }

        #filter-scroll {
            overflow-y: auto;
            padding: 15px 20px 90px;
            flex-grow: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
            scrollbar-gutter: stable;
        }

        .filter-section-header {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px;
            text-transform: uppercase;
            color: white;
            text-shadow:
                -1px -1px 0 black,
                 1px -1px 0 black,
                -1px  1px 0 black,
                 1px  1px 0 black;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .filter-section-header:hover {
            opacity: 0.85;
        }

        .filter-section-header::after {
            content: "▼";
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .filter-section-header.collapsed::after {
            transform: rotate(-90deg);
        }

        #filter-scroll > .filter-section-header {
            border-top: 3px solid rgba(0, 0, 0, 0.15);
            padding-top: 14px;
            margin-top: 20px;
        }

        #filter-scroll > .filter-section-header:first-child {
            border-top: none;
            padding-top: 0;
            margin-top: 0;
        }

        .filter-section-header.collapsed {
            margin-bottom: 10px;
        }

	.specific-region-header {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 5px;
            text-transform: uppercase;
            color: white;
            text-shadow:
                -1px -1px 0 black,
                 1px -1px 0 black,
                -1px  1px 0 black,
                 1px  1px 0 black;
            flex-basis: 100%;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 3px solid rgba(0, 0, 0, 0.15);
            padding-top: 10px;
        }

        .region-group:first-child .specific-region-header {
            border-top: none;
            padding-top: 0;
        }

        .specific-region-header:hover {
            opacity: 0.85;
        }

        .specific-region-header::after {
            content: "▼";
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .specific-region-header.collapsed::after {
            transform: rotate(-90deg);
        }

        .filter-btn {
            background-color: rgba(0, 0, 0, 0.70);
		color: white;
            border: none;
            padding: 10px 10px;
            margin: 5px;
            cursor: pointer;
		border: 3px solid rgba(0,0,0,0.25);
		text-transform: uppercase;
		text-shadow:
                -1px -1px 0 black,
                 1px -1px 0 black,
                -1px  1px 0 black,
                 1px  1px 0 black;
            border-radius: 20px;
            font-size: 15px;
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
		box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }
        .filter-btn.include { background-color: rgba(0, 153, 255, 0.70); color: white; }
        .filter-btn.exclude { background-color: rgba(255, 77, 77, 0.70); color: white; }

        #generation-section,
	#regional-pokedex-section,
        #evolution-section,
        #color-section,
        #types-section,
        #abilities-section,
        #other-section {
            display: flex;
            flex-wrap: wrap;
        }

        #generation-section .filter-btn,
	#regional-pokedex-section .filter-btn,
        #evolution-section .filter-btn,
        #color-section .filter-btn,
        #types-section .filter-btn,
        #abilities-section .filter-btn,
        #other-section .filter-btn {
            flex: 1 1 100px;
        }

        #generation-section .own-row,
	#regional-pokedex-section .own-row,
        #evolution-section .own-row,
        #color-section .own-row,
        #types-section .own-row,
        #abilities-section .own-row,
        #other-section .own-row {
            flex-basis: 100%;
        }

        /* Each region group (Kanto, Johto, etc.) is its own flex row so its
           buttons grow to fill space independently of the other regions */
        .region-group {
            display: flex;
            flex-wrap: wrap;
        }

        .region-group .filter-btn {
            flex: 1 1 100px;
        }

        /* Force these two sections into a fixed 2-column layout instead of
           the flexible wrap, so short trailing items (like Teleport/Paradox)
           don't end up stranded alone on their own row */
        #color-section,
        #abilities-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        #color-section .own-row,
        #abilities-section .own-row {
            grid-column: 1 / -1;
        }



        #reset-filters-btn {
            display: block;
            width: fit-content;
            margin: 10px auto 0;
        }

        #tag-search {
            padding: 10px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            margin-top: 10px;
        }

        /* ⭐ Responsive Gallery Grid */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(168px, 15%));
            gap: 6px;
            max-width: 100%;
            margin: 20px auto;
            padding: 0 10px;
		justify-content: center;
		place-content: center;
        }

        .image-card {
            position: relative; /* positioning context for .hit-zone below */
            width: 100%;
            /* Locks the card to a perfect square regardless of the img's
               own size — needed now that the img is inset within the frame
               (89.286% of the card, not the full 100% it used to be), since
               without this the grid would otherwise size each row off the
               now-shorter img instead of the full card. */
            aspect-ratio: 1 / 1;
            background: transparent;
            /* The frame sits behind everything as the card's own
               background — always paints before any child content, so it
               needs no z-index or extra element to stay behind the img. */
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/askidb229lcjkk5urfmby/Token-Border.png?rlkey=vfj3kgu9q9jfdzbq4yxvbp8ty&st=yk6ycn4l&dl=1");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            display: none;
            /* Hover-zoom below uses the standalone `scale` property rather
               than `transform`, specifically so it can coexist with
               .gallery-pulse's transform-based animation once that's also
               applied here (see that rule further down) — `scale` and
               `transform` are separate CSS properties that compose instead
               of overwriting one another, so a pulse firing while the
               cursor happens to be hovering (the common case right after
               clicking a card, since the pointer is still sitting on it)
               doesn't fight the hover-zoom for control of the same
               property. */
            transition: scale 0.15s ease;
        }
        .image-card.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Defines the actual clickable area as a circle matching the
           visible artwork, rather than the <img>'s full square box (whose
           corners are transparent PNG, not empty space the browser
           otherwise knows to ignore for clicks). Kept as its own element
           rather than clip-path on the <img> itself, since clip-path
           applies after filter effects — clipping the image directly would
           also chop off its drop-shadow's few px of bleed past the circle,
           flattening it at the clip edge instead of letting it fade
           naturally. This overlay has no visual content of its own, so
           clipping it has no such side effect. Sits on top of the image in
           paint order (later in the DOM); clicks inside the circle land
           here, clicks in the corners (now including the frame border
           around the art) fall through to the card's own background,
           handled the same as any other empty gallery space (see
           attachImageEvents). Hover-triggered zoom is unaffected either
           way, since that's keyed off the whole card's box, not this
           overlay. */
        .image-card .hit-zone {
            position: absolute;
            inset: 0;
            /* 44.643% instead of the full 50% — shrunk to match the art's
               now-smaller circle now that it's inset within the frame
               (150/168 of the card, same ratio as the img's own sizing
               below), so the clickable area still hugs the visible artwork
               instead of also covering part of the frame border. */
            clip-path: circle(44.643%);
            cursor: pointer;
        }

        .image-card img {
            /* 89.286% (150/168) rather than the full card width — insets
               the artwork within the frame's border, giving the frame a bit
               more visual presence than a strict 160/168 native-art inset
               would (its own comment history has that original math, if
               this ratio ever needs revisiting). Centered via
               .image-card.show's flex centering above rather than margin
               math here. */
            width: 89.286%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            /* No cursor:pointer here — the .hit-zone overlay above owns
               that now, and only across the circle it's actually clipped
               to. Setting it here too would show a pointer cursor across
               the whole square, including the corners that no longer do
               anything on click. */
            filter:
                drop-shadow(3px 3px 4px rgba(0,0,0,0.55));
            /* Forces its own stable compositing layer. Without this, a
               lazily-loaded image with a filter can finish decoding without
               the browser properly re-invalidating the filter's expanded
               paint region — leaving the drop-shadow clipped, or the image
               itself invisible, until something else (like a scroll) forces
               a repaint. This is a known interaction between loading="lazy"
               and CSS filter, and became far more visible once the service
               worker started resolving image loads near-instantly instead
               of over the network. */
            transform: translateZ(0);
        }
	  
	  /* :has() lets hovering the hit-zone (the actual circle) drive the
	     zoom on the whole card — frame included — rather than triggering
	     off the card's full square box like before, and rather than
	     zooming just the art and leaving the frame behind. Uses the
	     standalone `scale` property, not `transform` — see the comment on
	     .image-card above for why. */
	  .image-card:has(.hit-zone:hover) {
            scale: 1.1;
        }

        /* Marks whichever gallery image is currently shown in the magnify
           panel. Uses the #gallery-halo SVG filter (defined near the top of
           <body>) instead of stacked drop-shadow()s — see that filter's
           comment for why. The 2.5% size lives in that filter's
           feMorphology radius attribute, not here. Lives on the card
           itself rather than the img, so the glow traces the frame's outer
           edge instead of just the artwork inside it — same reasoning as
           the related-image thumbnails' identical move (see
           .related-thumb-wrap.related-active). */
        .image-card.active-in-viewer {
            filter: url(#gallery-halo);
        }

        /* Magnified view panel — docks to the top on mobile/portrait and
           is fullscreen there the moment it opens (matching #filter-panel's
           own mobile behavior), and docks to the left on desktop/landscape
           (the gallery's own reserved space, mirroring the filter panel's
           reserved space on the right). Always shares space with the
           gallery rather than covering it, so unlike the filter panel
           there's no dimming or scroll-lock at any breakpoint.

           #viewer-frame's padding (not a percentage on the image itself)
           is what creates the border around the image — matching amounts
           on all four sides. The image's max-width/max-height:100% resolve
           against viewer-frame's own definite, padded content box, which
           avoids a subtlety that caused the old version to bleed off
           screen: percentage sizing on an image nested inside an
           auto-sized wrapper (sized to fit the image itself) is circular,
           and browsers largely ignore percentage heights in that case. */
        #image-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh; /* fallback for browsers without dvh support */
            height: 100dvh;
            background: #111;
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
            transform: translateY(-100%);
            transition: transform 0.35s ease;
            z-index: 999;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #image-overlay.visible {
            transform: translateY(0);
        }


        #viewer-frame {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center; /* images are all exactly square, so centering keeps any sub-pixel vw/dvh rounding split evenly rather than collecting at one edge */
            position: relative; /* anchors the prev/next nav buttons AND the ::before tile layer below to just the image area, not the whole panel including the related section below */
		z-index: 0;
		overflow: hidden;
		background-image: url("https://dl.dropboxusercontent.com/scl/fi/1ipdyj5eh0erex4zvyjxq/Pokedex-Background-7.png?rlkey=aolpeh35zfq6ffpu4na5b6vr2&st=tfrnozrb&dl=1"), url("https://dl.dropboxusercontent.com/scl/fi/8ewm1e8mibpfasdf8cezl/Pokedex-Background-5.png?rlkey=t1o2cmqmla0xwn2wq5p6l36dl&st=tmzvpi8o&dl=1");
            background-size: cover, 240px 240px;
            background-position: center, center;
		background-repeat: no-repeat, repeat;
		background-attachment: fixed;
		background-blend-mode: multiply;
        }

        /* The scrolling tile (Background-8) used to live as a third layer
           in #viewer-frame's own background-image stack, but
           background-blend-mode applies to every layer in a stack
           uniformly -- there's no way to blend two layers with multiply
           while leaving a third layer un-blended within a single
           background. Pulling it out into its own ::before box sidesteps
           that: it's now a fully independent paint layer with no blend
           mode of its own, sitting between #viewer-frame's own
           (multiplied) background and the artwork/buttons on top.
           inset:-25% oversizes the box so its corners still cover the
           frame once rotated, and position:absolute lifts it out of the
           flex layout so it doesn't get flexed alongside overlay-img and
           the nav buttons. pointer-events:none keeps it from ever
           intercepting clicks meant for what's rendered above it,
           regardless of paint order. #viewer-frame's own z-index:0 (making
           it a stacking context) plus this layer's z-index:-1 is what
           keeps it behind overlay-img and the nav buttons; overflow:hidden
           on #viewer-frame clips the oversized, rotated box back down to
           the frame's actual rectangle. */
        #viewer-frame::before {
            content: "";
            position: absolute;
            inset: -25%; /* oversized so rotated corners still cover the frame */
		transform: rotate(-10deg);
		z-index: -1;
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/z0jiby2gqwo2s4t84lj2b/Pokedex-Background-8.png?rlkey=gt1o6z6omzhlkav876b1ra92v&st=afglo6te&dl=1");
            background-size: 600px 600px;
            background-repeat: repeat;
            pointer-events: none;
            animation: viewer-frame-tile-scroll 118s linear infinite;
        }

        /* Scrolls the tile along a path of (6600px, 2400px) -- both exact
           multiples of the 600px background-size above, which is what
           keeps the loop seamless despite the odd-looking numbers. That
           path works out to roughly a 110° local scroll direction, which
           after the box's own -10° rotation reads as ~100° on-screen
           (measuring clockwise from north, compass-style). Swap the 600px
           in background-size above and both of these multiples-of-600px
           numbers together if you resize the tile again. */
        @keyframes viewer-frame-tile-scroll {
            from { background-position: 0 0; }
            to   { background-position: 6600px 2400px; }
        }

        /* Respect reduced-motion preferences -- freezes the tile in place
           instead of continuously scrolling it. */
        @media (prefers-reduced-motion: reduce) {
            #viewer-frame::before {
                animation: none;
            }
        }

        #image-close-btn {

           its width each — unchanged from before. What moved is the
           visible arrow glyph itself: align-items/justify-content push it
           into the bottom corner of its zone (flex-end + flex-start/end)
           instead of dead-center, and the button is always visible now
           rather than only on hover/tap — see the removed .nav-btn-flash
           JS logic, which existed solely to manage that hover state and
           is no longer needed. Sits above #overlay-img but below
           #image-close-btn, so the close button stays reachable where its

            top: 0;
            bottom: 0;

           that's anchored right at the glyph's own position, rather than
           scaling the entire 33%-wide button and having the corner-pinned
           arrow visibly drift as a side effect. display:inline-block is

        #viewer-related-wrapper {

            background-size: cover, 240px 240px;
            background-position: center, center;
		background-repeat: no-repeat, repeat;
		background-attachment: fixed;
		background-blend-mode: multiply;
        }

        #image-overlay.related-expanded #viewer-related-wrapper {
            grid-template-rows: 1fr;

        #viewer-related-inner {
            overflow: hidden;
            min-height: 0;
        }

        #viewer-related-grid {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            padding: 12px;
		padding-bottom: 8vh;
            height: 40dvh;
		align-items: center;
            /* "safe" falls back to flex-start once the row is wider than
               the section, so the left edge of an overflowing row stays
               reachable by scrolling — plain "center" can leave that
               overflow permanently stuck off-screen with no way to scroll
               to it, since scrollLeft can't go negative. */
            justify-content: safe center;
            overflow-x: auto;
            overflow-y: hidden;
            box-sizing: border-box;
            cursor: grab;
            touch-action: pan-x; /* keeps native touch panning limited to this axis, matching the mouse/pointer drag behavior */
        }

        /* Applied via JS for the duration of an active click-and-drag pan.
           Disables selection/tap-highlight so dragging across thumbnails
           doesn't select their alt text or show a mobile-style highlight
           flash along the way. */
        #viewer-related-grid.dragging {
            cursor: grabbing;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Sits behind each related-image thumbnail as a decorative frame —
           mirrors .image-card's treatment in the main gallery exactly (same
           frame art, same 150/168 inset ratio, same hit-zone/hover/halo/
           pulse mechanics below), just at a fixed pixel size rather than
           the gallery's responsive one, since this row doesn't grow with
           the viewport. */
        .related-thumb-wrap {
            position: relative;
            width: 168px;
            height: 168px;
            flex: 0 0 auto; /* without this, thumbnails shrink to squeeze into the row instead of overflowing it, defeating the horizontal-scroll behavior above */
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/askidb229lcjkk5urfmby/Token-Border.png?rlkey=vfj3kgu9q9jfdzbq4yxvbp8ty&st=yk6ycn4l&dl=1");
            background-size: 168px 168px;
            background-repeat: no-repeat;
            background-position: center;
            /* Hover-zoom below uses the standalone `scale` property rather
               than `transform`, same reasoning as .image-card in the main
               gallery: .gallery-pulse (further down) is transform-based, so
               keeping hover on a separate property lets a pulse and a hover
               coexist on this same element without fighting for control of
               transform. */
            transition: scale 0.15s ease;
        }

        #viewer-related-grid img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            box-sizing: border-box;
            /* No cursor:pointer here — .related-hit-zone below owns that
               now, same split as .image-card/.hit-zone in the main gallery. */
        }

        /* Same role as .image-card .hit-zone in the main gallery: defines
           the actual clickable/hoverable area as a circle matching the
           visible artwork (150/168 of the wrapper, same ratio as the img's
           own sizing above) rather than the img's full square box, whose
           corners are transparent PNG. Unlike the gallery's version, a
           corner click here has nothing in particular to fall through to
           (there's no "close panel" affordance for this row) — it simply
           does nothing, which is the more correct behavior anyway now that
           part of that square is genuinely frame border, not just empty
           transparent pixels. */
        .related-hit-zone {
            position: absolute;
            inset: 0;
            clip-path: circle(44.643%);
            cursor: pointer;
        }

        /* Mirrors .image-card:has(.hit-zone:hover) exactly: hovering the
           circular hit-zone scales the whole frame+art unit together,
           rather than just the art inside it. */
        .related-thumb-wrap:has(.related-hit-zone:hover) {

        }

           than the img itself so the glow traces the frame's outer edge

        .related-thumb-wrap.related-active {

        /* Pokédex Panel — three layered panels */
        #pokedex-panel {

        /* Frame bars: mask the outer edges of panels 2/3. Width is set by
           JS (see anchorFrameBars below) so the bars' inner edge always
           lands 955 native pixels in from the background image's actual
           edge, regardless of window size/aspect — not a percentage
           approximation. The calc() fallback (old formula) only applies
           before that JS runs once on load. These stay as vertical bars
           on the left/right at every aspect ratio, including portrait.
           Sit above panel 1 but below panels 2/3 and panel 4. */
        #pokedex-bar-left,
        #pokedex-bar-right {
            position: absolute;
            top: 0;
            left: 0;
            width: var(--bar-anchor-width, max(1%, calc(50% - 28dvh)));
            height: 100%;
            z-index: 2;
            background-color: #000;
            transition: transform 0.7s ease 1.3s;
            transform: translateX(0);

            transform: translateX(-100%);
            transition: transform 0.7s ease 1.0s;
        }

        #pokedex-panel.closed #pokedex-bar-right {
            transform: translateX(100%);
            transition: transform 0.7s ease 1.0s;
        }

        #pokedex-panel.closed #pokedex-bar-left,
        #pokedex-panel.closed #pokedex-bar-right {
            pointer-events: none;
        }

        #pokedex-panel-1,
        #pokedex-panel-2,
        #pokedex-panel-3,
	#pokedex-panel-4 {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: auto;
        }

        /* Panel 1: back layer — full-screen background. Last to fade out on
           close (after panels 2/3 and the bars finish), first to return on
           open. */
        #pokedex-panel-1 {
            z-index: 1;
            transition: opacity 1s ease 0s;
            opacity: 1;
        }

        #pokedex-panel.closed #pokedex-panel-1 {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease 2.0s;
        }

        /* Panel 4: fades out on close too — this rule was accidentally
           dropped in an earlier restructure, which is why it was staying
           on screen (and clickable) even after "closing". Fades out
           immediately in sync with panels 2/3 retracting off-screen, but
           on open waits and fades in sync with panels 2/3 sliding back
           into frame (matching their 2.3s delay) rather than fading in
           right away. */
	#pokedex-panel-4 {
	    z-index: 4;
            transition: opacity 0.7s ease 2.3s;
            opacity: 1;
	}

        #pokedex-panel.closed #pokedex-panel-4 {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease 0s;
        }

        /* Panel 2: top band, retracts up off the top of the screen on close.
           Delay is 0 when closing (retracts immediately) but delayed when
           opening to wait for panel 1 then the bars to finish first. */
        #pokedex-panel-2 {
            top: 0;
            left: 0;
            width: 100%;
            height: clamp(50vh, 50vh, 100vh); /* fallback for browsers without dvh support */
            height: clamp(50dvh, 50dvh, 100dvh); /* fallback until the JS below sets --real-vh */
            height: calc(var(--real-vh, 100dvh) * 0.5);
            z-index: 3;
            transition: transform 0.7s ease 2.3s;
            transform: translateY(0);
        }

        #pokedex-panel.closed #pokedex-panel-2 {
            transform: translateY(-125%);
            transition: transform 0.7s ease 0s;
        }

        /* Panel 3: bottom band, retracts down off the bottom of the screen on close */
        #pokedex-panel-3 {
            top: auto;
            bottom: 0;
            left: 0;
            width: 100%;
            height: clamp(50vh, 50vh, 100vh); /* fallback for browsers without dvh support */
            height: clamp(50dvh, 50dvh, 100dvh); /* fallback until the JS below sets --real-vh */
            height: calc(var(--real-vh, 100dvh) * 0.5);
            z-index: 3;
            transition: transform 0.7s ease 2.3s;
            transform: translateY(0);
        }

        #pokedex-panel.closed #pokedex-panel-3 {
            transform: translateY(125%);
            transition: transform 0.7s ease 0s;
        }

        /* Safety-net filler: sits entirely BELOW panel 3's own bottom edge —
           it does not overlap panel 3's footprint at all, so it can't block
           the transparent gap in panel 3's artwork where panel 1 shows
           through. Positioned with the static vh unit (not dvh), so it
           never has to recompute or lag. Normally fully off-screen/invisible;
           only revealed if extra viewport space appears below where panel 3
           currently ends during a resize. Same open/close transform as
           panel 3, so it moves with it. */
        #pokedex-safety-filler {
            position: absolute;
            top: auto;
            bottom: -15vh;
            left: 0;
            width: 100%;
            height: 15vh;
            z-index: 3;
            background-color: #000;
            transition: transform 0.7s ease 2.3s;
            transform: translateY(0);
        }

        #pokedex-panel.closed #pokedex-safety-filler {
            transform: translateY(125%);
            transition: transform 0.7s ease 0s;
        }

        /* Shared background layer. Panel 1's is sized slightly larger than its
           panel so the blur doesn't reveal transparent edges; panels 2 & 3
           fill their own (smaller) band exactly. */
        .pokedex-bg {
            position: absolute;
            inset: 0;
            background-size: cover;

        #pokedex-panel-2 .pokedex-bg {

    <!-- Hidden SVG filter used by the gallery's "active in magnify view" halo.
         feGaussianBlur spreads the sprite's alpha shape outward — this is
         isotropic (equally smooth in every direction), unlike feMorphology's
         dilate operator, which per spec uses a rectangular structuring
         element and produces flat, axis-aligned facets on anything but a
         rectangular source shape. The blurred alpha is then thresholded
         back to a hard edge (feComponentTransfer's steep linear ramp,
         clamped to 0/1) at a chosen cutoff, flooded solid blue, and merged
         underneath the original image. Both stdDeviation (blur amount) and
         the threshold cutoff affect the resulting halo's thickness — they
         don't map to a simple "% of size" the way feMorphology's radius did,
         so treat them as a pair to tune together if the thickness needs
         adjusting. -->
    <svg width="0" height="0" style="position: absolute;">
        <filter id="gallery-halo" x="-50%" y="-50%" width="200%" height="200%" primitiveUnits="objectBoundingBox">
            <feGaussianBlur in="SourceAlpha" stdDeviation="0.03" result="blurred"/>
            <feComponentTransfer in="blurred" result="thresholded">
                <feFuncA type="linear" slope="50" intercept="-4.5"/>
            </feComponentTransfer>
            <feFlood flood-color="#abfafe" result="blueFlood"/>
            <feComposite in="blueFlood" in2="thresholded" operator="in" result="halo"/>
            <feMerge>
                <feMergeNode in="halo"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>

    <script>
        // Keeps panels 2/3's height synced to the TRUE current viewport via
        // the visualViewport API, rather than any CSS viewport unit. Chrome/
        // Edge on Android defers the layout viewport's resize until its own
        // address-bar show/hide animation finishes, then applies it in one
        // jump — which is what caused the lag no CSS unit (vh/dvh/svh/%)
        // could get around, since they're all downstream of that same
        // deferred layout recalculation.
        //
        // visualViewport's own 'resize'/'scroll' events are a big
        // improvement, but don't necessarily fire on every single frame of
        // the browser's own address-bar animation — just at some coarser
        // interval — so there can still be a brief stale beat mid-animation.
        // To close that gap further, once a resize/scroll starts we also
        // poll visualViewport.height on every animation frame for a short
        // window, which tracks as close to the live animation as JS can get.
        (() => {
            const root = document.documentElement;
            const POLL_WINDOW_MS = 600; // keep sampling this long after the last resize/scroll event

            let pollUntil = 0;
            let polling = false;

            function applyHeight() {
                const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                root.style.setProperty('--real-vh', `${height}px`);
            }

            function pollFrame() {
                applyHeight();
                if (performance.now() < pollUntil) {
                    requestAnimationFrame(pollFrame);
                } else {
                    polling = false;
                }
            }

            function startPolling() {
                pollUntil = performance.now() + POLL_WINDOW_MS;
                if (!polling) {
                    polling = true;
                    requestAnimationFrame(pollFrame);
                }
            }

            applyHeight();

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', startPolling);
                window.visualViewport.addEventListener('scroll', startPolling);
            } else {
                window.addEventListener('resize', applyHeight);
            }
        })();
    </script>

    <script>
        // Reusable, reference-counted page-scroll lock. Multiple overlays
        // (splash, Pokédex panel, filter panel, image viewer) can each
        // request a lock independently — e.g. the splash and the Pokédex
        // panel are both "open" simultaneously during the initial auto-open
        // sequence — and the page only actually unlocks once every
        // requester has released it, so one closing early can't
        // accidentally re-enable scrolling while another is still up.
        //
        // Uses position:fixed + a saved scroll offset rather than plain
        // `overflow: hidden` on body, since overflow:hidden alone doesn't
        // reliably block touch-drag scrolling on iOS Safari and some
        // Android browsers — this project has been mobile-driven enough
        // that it's worth doing the more robust version up front.
        window.pageScrollLock = (() => {
            let lockCount = 0;
            let savedScrollY = 0;

            function lock() {
                if (lockCount === 0) {
                    savedScrollY = window.scrollY;
                    document.body.style.position = 'fixed';
                    document.body.style.top = `-${savedScrollY}px`;
                    document.body.style.left = '0';
                    document.body.style.right = '0';
                }
                lockCount++;
            }

            function unlock() {
                lockCount = Math.max(0, lockCount - 1);
                if (lockCount === 0) {
                    document.body.style.position = '';
                    document.body.style.top = '';
                    document.body.style.left = '';
                    document.body.style.right = '';
                    window.scrollTo(0, savedScrollY);
                }
            }

            return { lock, unlock };
        })();
    </script>

    <script>
        // Loading splash sequencing. Attached immediately (not on
        // window load) since the image may finish loading — especially
        // from cache — before the rest of the page/scripts do.
        (() => {
            const MIN_DELAY_BEFORE_FADE_IN = 1000; // at least 1s from page load before the image starts fading in
            const HOLD_DURATION = 4000;            // how long it stays up once fully faded in
            const BG_EXTRA_DELAY = 1000;            // background lingers this long after the image starts fading out

            const pageStart = Date.now(); // approximate page-load reference point; this script runs immediately after <body> opens
            const splash = document.getElementById('loading-splash');
            const splashImg = document.getElementById('loading-splash-img');

            window.pageScrollLock.lock(); // locked for the splash's entire lifetime

            function fadeInImage() {
                splashImg.classList.add('loaded');
                splashImg.addEventListener('transitionend', hold, { once: true });
            }

            function scheduleFadeIn() {
                const elapsed = Date.now() - pageStart;
                const remaining = Math.max(0, MIN_DELAY_BEFORE_FADE_IN - elapsed);
                setTimeout(fadeInImage, remaining);
            }

            function hold() {
                setTimeout(fadeOut, HOLD_DURATION);
            }

            function fadeOut() {
                // Image fades out first...
                splashImg.classList.remove('loaded');
                // ...and the black background follows about a second later.
                setTimeout(() => {
                    splash.classList.add('hidden');
                    splash.addEventListener('transitionend', () => {
                        splash.remove();
                        window.pageScrollLock.unlock();
                    }, { once: true });
                }, BG_EXTRA_DELAY);
            }

            if (splashImg.complete && splashImg.naturalWidth > 0) {
                // Already loaded (e.g. from browser cache) by the time this runs.
                scheduleFadeIn();
            } else {
                splashImg.addEventListener('load', scheduleFadeIn);
                // Fail-safe: don't leave the splash stuck up forever if the image fails to load.
                splashImg.addEventListener('error', fadeOut);
            }
        })();
    </script>

    <script>
        // Register the service worker that caches Pokémon images locally.
        // Requires HTTPS (or localhost) — silently no-ops otherwise, e.g. if
        // this file is opened directly from disk as a file:// URL.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service worker registered, scope:', reg.scope))
                    .catch(err => console.warn('Service worker registration failed:', err));
            });
        }

        // Tags typed into the search box that don't belong to any known
        // section at all (most tags — only a subset have a button
        // anywhere) — these OR together among themselves and AND against
        // everything else, same as always.
        let includeFilters = [];
        let excludeFilters = [];

        // Every section's DOM container, by key. Every filter button on
        // the page lives inside exactly one of these.
        const SECTION_IDS = {
            types: 'types-section',
            evolution: 'evolution-section',
            abilities: 'abilities-section',
            other: 'other-section',
            generation: 'generation-section',
            regional: 'regional-pokedex-section',
            color: 'color-section',
        };

        // Of those, only these four can flip between OR-within ("Match:
        // Any") and AND-within ("Match: All") via their own toggle button,
        // defaulting to AND on page load. The rest (generation, regional,
        // color) stay permanently OR-within — same fixed behavior
        // Generation already had before this change, just now shared by
        // its siblings instead of being a one-off.
        const TOGGLEABLE_SECTIONS = {
            types: 'types-section',
            evolution: 'evolution-section',
            abilities: 'abilities-section',
            other: 'other-section',
        };
        let sectionMatchAll = { types: true, evolution: true, abilities: true, other: true };

        // Independent of the Abilities section's own bucket (sectionFilters
        // below, which only matters when specific ability tags are
        // actually selected) — this is a standalone on/off requirement
        // that a card have at least one of the four ability tags at all,
        // regardless of which ones (if any) are individually selected.
        let hideNoAbility = false;

        // One bucket per section, holding whichever of its own tags are
        // currently selected (by button or by a plain typed word that
        // matches one of its buttons). Matching per section, in
        // filterGallery(): AND-within only for a toggleable section
        // currently set to Match:All; every other case — every
        // non-toggleable section always, or a toggleable one set to
        // Match:Any — is OR-within. Every section's bucket then ANDs
        // together with every other section's (and with includeFilters,
        // explicitOrGroups, and !excludeFilters below), so a selection in
        // one category always narrows results rather than the old
        // behavior where unrelated selections from different categories
        // could end up OR'd against each other and canceling each other
        // out.
        let sectionFilters = {
            types: [], evolution: [], abilities: [], other: [],
            generation: [], regional: [], color: [],
        };

        // Explicit OR-groups from the search box only (e.g. typing
        // "water/ground" or "water\ground") — each inner array is one
        // slash/backslash-joined group, at least one tag from each group
        // must be present, and every group must pass (AND across groups).
        // Bypasses section-based AND/OR routing entirely: this is a
        // deliberate override for when the person typing wants OR
        // regardless of what a tag's section would normally do, so it
        // doesn't check section membership like the plain-tag path does.
        // Fully rebuilt on every parseSearchFilters() call rather than
        // merged in — unlike the other filter arrays, nothing here ever
        // originates from a button, so there's no existing state to
        // preserve.
        let explicitOrGroups = [];

        const gallery = document.getElementById("gallery");
        const panel = document.getElementById('filter-panel');
        const overlay = document.getElementById('overlay');
        const openBtn = document.getElementById('open-filters-btn');

        const pokedexPanel = document.getElementById("pokedex-panel");
        const pokedexBtn = document.getElementById("open-pokedex-btn");

        // Anchor the frame bars to a fixed point in the background artwork
        // itself (500px in from its native-resolution edge) rather than a
        // percentage of the window. Panels 2/3 use `background-size: auto 100%`
        // (height-locked, width auto-scaled, centered) — so the same math the
        // browser uses to render that background is reproduced here in JS to
        // find where the image's edge actually lands, then add 500 scaled px.
        (() => {
            const ANCHOR_NATIVE_PX = 955;
            const MIN_BAR_FRACTION = 0.01; // keep the old 1% sliver as a floor

            const panel2 = document.getElementById('pokedex-panel-2');
            const panel3 = document.getElementById('pokedex-panel-3');

            function loadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });
            }

            function bgUrlFor(el) {
                const bg = el.querySelector('.pokedex-bg');
                const cssUrl = getComputedStyle(bg).backgroundImage;
                const match = cssUrl.match(/url\(["']?(.*?)["']?\)/);
                return match ? match[1] : null;
            }

            function requiredWidthFor(panelEl, img) {
                const rect = panelEl.getBoundingClientRect();
                if (!rect.height || !img.naturalHeight) return 0;
                const scale = rect.height / img.naturalHeight;
                const renderedImgWidth = img.naturalWidth * scale;
                const imageLeftEdge = (rect.width - renderedImgWidth) / 2; // background-position: center (horizontally)
                return imageLeftEdge + (ANCHOR_NATIVE_PX * scale);
            }

            Promise.all([
                loadImage(bgUrlFor(panel2)),
                loadImage(bgUrlFor(panel3))
            ]).then(([topImg, bottomImg]) => {
                function recalc() {
                    const rect = panel2.getBoundingClientRect();
                    const floorPx = rect.width * MIN_BAR_FRACTION;
                    const needed = Math.max(
                        requiredWidthFor(panel2, topImg),
                        requiredWidthFor(panel3, bottomImg)
                    );
                    const width = Math.max(floorPx, needed);
                    document.documentElement.style.setProperty('--bar-anchor-width', `${width}px`);
                }

                recalc();
                new ResizeObserver(recalc).observe(panel2);
                window.addEventListener('resize', recalc);
            }).catch(err => {
                console.warn('Could not anchor frame bars to background image; falling back to CSS formula.', err);
            });
        })();

        // pageScrollLock is reference-counted, and both directions are now
        // delayed rather than instant — so a rapid open/close/open toggle
        // could otherwise fire an extra lock() or unlock() with no matching
        // partner (e.g. reopening before a scheduled unlock fires would
        // cancel that unlock AND call lock() again, leaking an increment
        // that's never balanced). Tracking whether the lock is actually
        // currently engaged, and only ever scheduling the action that
        // would flip it, keeps every lock() paired with exactly one
        // unlock() regardless of how fast the panel gets toggled.
        let pokedexScrollLockTimeout = null;
        let pokedexScrollLockEngaged = false;

        function openPokedexPanels() {
            if (pokedexPanel.classList.contains("closed")) {
                pokedexPanel.classList.remove("closed");
                if (pokedexScrollLockTimeout) {
                    clearTimeout(pokedexScrollLockTimeout);
                    pokedexScrollLockTimeout = null;
                }
                if (!pokedexScrollLockEngaged) {
                    // Land between panel 1 finishing its fade-in (1.0s) and
                    // the side bars starting to slide in (1.3s).
                    pokedexScrollLockTimeout = setTimeout(() => {
                        window.pageScrollLock.lock();
                        pokedexScrollLockEngaged = true;
                        pokedexScrollLockTimeout = null;
                    }, 1150);
                }
            }
        }

        function closePokedexPanels() {
            if (!pokedexPanel.classList.contains("closed")) {
                pokedexPanel.classList.add("closed");
                if (pokedexScrollLockTimeout) {
                    clearTimeout(pokedexScrollLockTimeout);
                    pokedexScrollLockTimeout = null;
                }
                if (pokedexScrollLockEngaged) {
                    // Land after the side bars finish retracting (1.7s) but
                    // before panel 1 begins fading out (2.0s).
                    pokedexScrollLockTimeout = setTimeout(() => {
                        window.pageScrollLock.unlock();
                        pokedexScrollLockEngaged = false;
                        pokedexScrollLockTimeout = null;
                    }, 1850);
                }
            }
        }

        // The panel starts in the "closed" markup state on purpose (see the
        // class on #pokedex-panel) so this fires the exact same slide-in
        // transform animation used by the manual open button, rather than
        // ever rendering the panels open with no animation at all. This
        // whole sequence plays out behind the loading splash, so visually
        // nothing changes for the user — but it's what settles panels 2/3
        // into a correctly laid-out state at load time too, matching what
        // was already working on manual close/reopen.
        requestAnimationFrame(() => {
            requestAnimationFrame(openPokedexPanels);
        });

        pokedexBtn.addEventListener("click", () => {
            const isClosed = pokedexPanel.classList.contains("closed");

            closeFilterPanel();
            closeImageViewer();

            if (isClosed) {
                openPokedexPanels();
            } else {
                closePokedexPanels();
            }
        });

        document.getElementById("pokedex-click-zone").addEventListener("click", closePokedexPanels);

        fetch("https://raw.githubusercontent.com/pmtupokedex/PMTU-Searchable-Pokedex/main/pokemon-data.json")
            .then(response => response.json())
            .then(data => {
                data.forEach(p => {
                    const card = document.createElement("div");
                    card.className = "image-card";
                    card.dataset.tags = p.tags.join(" ");

                    const img = document.createElement("img");
                    img.loading = "lazy";
                    img.src = p.src;
                    img.alt = p.name;
                    // First tag is always the National Dex number (e.g. "025"),
                    // or a non-numeric marker ("???", "PS1"...) for entries with
                    // no official Pokédex data — used by the info panel below.
                    img.dataset.dex = p.tags[0] || '';

                    const hitZone = document.createElement("div");
                    hitZone.className = "hit-zone";

                    card.appendChild(img);
                    card.appendChild(hitZone);
                    gallery.appendChild(card);
                });

                attachImageEvents();
                filterGallery();
            });

        function attachImageEvents() {
            document.querySelectorAll('.image-card').forEach(card => {
                const img = card.querySelector('img');
                const hitZone = card.querySelector('.hit-zone');
                hitZone.addEventListener('click', () => {
                    if (card.classList.contains('active-in-viewer')) {
                        closeImageViewer();
                    } else {
                        openImageViewer(img);
                    }
                });
                // A click landing directly on the image itself (rather than
                // the hit-zone on top of it) only happens in the square's
                // transparent corners, since the hit-zone covers the circle
                // and intercepts anything within it first. Treated the same
                // as clicking any other empty space in the gallery.
                img.addEventListener('click', () => closeOpenPanels());
                // Defensive catch-all: a click landing on .image-card's own
                // background (neither the image nor the hit-zone) shouldn't
                // be possible now that display:block above removes the
                // known baseline-gap cause, but sub-pixel layout rounding
                // between a parent and child box that are meant to match
                // exactly can still occasionally leave a stray edge pixel
                // uncovered in some browsers/zoom levels. Same treatment as
                // any other empty space either way.
                card.addEventListener('click', (e) => {
                    if (e.target === card) closeOpenPanels();
                });
            });
        }


        // Most tags typed into the search box have no corresponding button
        // anywhere — this only matters for the ones that do. Returns the
        // section key (a key of SECTION_IDS) whose button list contains a
        // matching tag, or null if there's no button for it anywhere.
        function findSectionForTag(tag) {
            for (const key of Object.keys(SECTION_IDS)) {
                const sectionEl = document.getElementById(SECTION_IDS[key]);
                if (!sectionEl) continue;
                const hasTag = Array.from(sectionEl.querySelectorAll('.filter-btn[data-tag]'))
                    .some(btn => btn.dataset.tag.toLowerCase() === tag);
                if (hasTag) return key;
            }
            return null;
        }

        function parseSearchFilters() {
            includeFilters = includeFilters.filter(f => !f.startsWith("search:"));
            excludeFilters = excludeFilters.filter(f => !f.startsWith("search:"));
            explicitOrGroups = [];
            Object.keys(sectionFilters).forEach(key => {
                sectionFilters[key] = sectionFilters[key].filter(f => !f.startsWith("search:"));
            });

            const input = document.getElementById('tag-search').value.trim().toLowerCase();
            if (!input) return;

            const parts = input.split(/\s+/);
            parts.forEach(token => {
                const isExclude = token.startsWith("-");
                const body = isExclude ? token.substring(1) : token;
                // Splits "water/ground" or "water\ground" (either
                // separator, freely mixed) into its individual tags. A
                // stray/lone slash with nothing on one or both sides (e.g.
                // a token that was just "/") collapses to zero segments —
                // filter(Boolean) drops those rather than letting an empty
                // group through, which would otherwise make .some() below
                // trivially false and silently hide every single card.
                const segments = body.split(/[\/\\]+/).filter(Boolean);

                if (segments.length === 0) return; // nothing usable in this token

                if (segments.length >= 2) {
                    // Explicit OR-group: bypasses section routing entirely
                    // for these specific tags, same treatment for includes
                    // and excludes since exclude is already OR-style across
                    // separate tokens anyway (-water -ground already means
                    // "hide if either" — this is just a more compact way to
                    // write the same thing in one token).
                    if (isExclude) {
                        segments.forEach(tag => excludeFilters.push("search:" + tag));
                    } else {
                        explicitOrGroups.push(segments);
                    }
                    return;
                }

                // No slash — falls through to the existing single-tag
                // handling exactly as before.
                const tag = segments[0];
                if (isExclude) {
                    excludeFilters.push("search:" + tag);
                } else {
                    // If this tag has a button somewhere, fold it into that
                    // section's own bucket so it combines the same way a
                    // click on that button would (AND-within if the section
                    // is toggleable and set to Match:All, OR-within
                    // otherwise) instead of landing in the general
                    // no-section-at-all pool below.
                    const sectionKey = findSectionForTag(tag);
                    if (sectionKey) {
                        sectionFilters[sectionKey].push("search:" + tag);
                    } else {
                        includeFilters.push("search:" + tag);
                    }
                }
            });
        }

        function updateFilters() {
            includeFilters = [];
            excludeFilters = [];
            sectionFilters = {
                types: [], evolution: [], abilities: [], other: [],
                generation: [], regional: [], color: [],
            };

            document.querySelectorAll('.filter-btn.include[data-tag]').forEach(btn => {
                const tag = btn.dataset.tag.toLowerCase();
                const sectionKey = Object.keys(SECTION_IDS).find(
                    key => btn.closest('#' + SECTION_IDS[key]) !== null
                );
                if (sectionKey) {
                    sectionFilters[sectionKey].push(tag);
                } else {
                    // Shouldn't normally happen — every filter button lives
                    // inside one of the sections above — but falls back to
                    // the loose pool rather than silently dropping the
                    // selection if one ever exists outside all of them.
                    includeFilters.push(tag);
                }
            });
            document.querySelectorAll('.filter-btn.exclude[data-tag]').forEach(btn =>
                excludeFilters.push(btn.dataset.tag.toLowerCase())
            );

            parseSearchFilters();
            filterGallery();
        }

        function filterGallery() {
            const cards = document.querySelectorAll('.image-card');
            cards.forEach(card => {
                const tags = card.dataset.tags.toLowerCase().split(/\s+/);
                const includeMatch =
                    includeFilters.length === 0 ||
                    includeFilters.some(f => tags.includes(f.replace("search:", "")));

                // Every section's bucket must pass on its own (AND across
                // sections) — within a section, AND-within only applies for
                // a toggleable section currently set to Match:All; every
                // other case (every non-toggleable section always, or a
                // toggleable one set to Match:Any) is OR-within.
                const sectionsMatch = Object.entries(sectionFilters).every(([key, list]) => {
                    if (list.length === 0) return true;
                    const andWithin = key in TOGGLEABLE_SECTIONS && sectionMatchAll[key];
                    return andWithin
                        ? list.every(f => tags.includes(f.replace("search:", "")))
                        : list.some(f => tags.includes(f.replace("search:", "")));
                });

                // Every slash-group must contribute at least one matching
                // tag (AND across groups), but within a single group any
                // one of its tags is enough (OR) — e.g. "water/ground
                // fire/grass" requires (water or ground) AND (fire or
                // grass).
                const explicitOrMatch = explicitOrGroups.every(
                    group => group.some(f => tags.includes(f))
                );

                const excludeMatch =
                    excludeFilters.some(f => tags.includes(f.replace("search:", "")));

                const hideNoAbilityMatch =
                    !hideNoAbility ||
                    ['dig', 'fly', 'surf', 'teleport'].some(f => tags.includes(f));

                card.classList.toggle(
                    'show',
                    sectionsMatch && includeMatch && explicitOrMatch && hideNoAbilityMatch && !excludeMatch
                );
            });
        }

        // One toggle button per AND/OR-switchable section — mirrors the
        // original types-only toggle, just wired up for all four sections
        // that support it now.
        Object.entries(TOGGLEABLE_SECTIONS).forEach(([key, sectionId]) => {
            const toggleBtn = document.getElementById(`${key}-match-toggle`);
            if (!toggleBtn) return;
            toggleBtn.addEventListener('click', () => {
                sectionMatchAll[key] = !sectionMatchAll[key];
                toggleBtn.textContent = sectionMatchAll[key] ? "Match: All" : "Match: Any";
                updateFilters();
            });
        });

        const hideNoAbilityToggle = document.getElementById('hide-no-ability-toggle');
        hideNoAbilityToggle.addEventListener('click', () => {
            hideNoAbility = !hideNoAbility;
            hideNoAbilityToggle.textContent = hideNoAbility
                ? "Show Pokémon Without Abilities"
                : "Hide Pokémon Without Abilities";
            // No button/search-box state changed, so filterGallery() alone
            // is enough — no need for the full updateFilters() rebuild.
            filterGallery();
        });

        function resetFilters() {
            // Routed through updateFilters (which rebuilds every state
            // array from scratch off whatever's currently selected) rather
            // than resetting includeFilters/excludeFilters by hand — hand-
            // resetting only those two used to miss the per-section AND-
            // group state entirely, so a "Clear All Filters" click could
            // still leave an old AND-group selection silently affecting
            // results even with every button visibly deselected.
            document.getElementById('tag-search').value = "";
            document.querySelectorAll('.filter-btn[data-tag]').forEach(btn =>
                btn.classList.remove('include', 'exclude')
            );
            // hideNoAbility has no data-tag, so the loop above never
            // touches it — needs resetting explicitly, same reasoning as
            // the AND-group state above.
            hideNoAbility = false;
            hideNoAbilityToggle.textContent = "Hide Pokémon Without Abilities";
            updateFilters();
        }

        function resetGeneration() {
            document.querySelectorAll('#generation-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetRegional() {
            document.querySelectorAll('#regional-pokedex-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetStage() {
            document.querySelectorAll('#evolution-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetColor() {
            document.querySelectorAll('#color-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetTypes() {
