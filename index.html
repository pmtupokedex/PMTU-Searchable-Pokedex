<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMTU Searchable Pokédex</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/gtzz25xtbyr9exna2k7bs/Pokedex-Background.png?rlkey=wh4zk3w1nbnnincyh7uc4zl1x&st=sge4tped&dl=1");
            background-size: 100% 100%;
            background-position: center;
            background-attachment: fixed;
        }

        /* The padding transition only applies during this short window,
           added right when a panel actually opens/closes and removed a
           beat later (see beginPanelAnim() in the script). Keeping it off
           the rest of the time matters: body's padding is also driven by
           a clamp()/vw-based formula while a panel is open, which
           recalculates continuously as the window is resized — an
           unconditional transition would smooth those resize-driven
           changes too, creating a lag between the gallery's actual
           available width and the true current window width. That lag is
           what caused the grid's column count to visibly snap to the next
           threshold and back while dragging the resize handle. */
        body.panel-animating {
            transition: padding 0.4375s ease; /* 0.35s base, slowed 25% */
        }

        /* Brief attention pulse, triggered once the scroll that follows an
           open/close settles, to draw the eye to the image's new position.
           Keeps the translateZ(0) layer-promotion trick from the base
           .image-card img rule alive throughout so the drop-shadow filter
           doesn't flicker mid-pulse. */
        @keyframes gallery-pulse {
            0%   { transform: translateZ(0) scale(1); }
            35%  { transform: translateZ(0) scale(1.15); }
            65%  { transform: translateZ(0) scale(0.97); }
            100% { transform: translateZ(0) scale(1); }
        }

        .image-card img.gallery-pulse {
            animation: gallery-pulse 600ms ease-out;
        }

        /* Mobile/portrait: magnified view docks to the top, so the gallery
           reserves space up there instead of being covered. Desktop swaps
           this for padding-left (see the min-width:900px override below),
           since the panel docks to the left there instead. */
        body.viewer-open {
            padding-top: calc(20px + min(60vh, 100vw)); /* fallback for browsers without dvh support */
            padding-top: calc(20px + min(60dvh, 100vw));
        }

        /* Buttons */
        #open-filters-btn, #open-pokedex-btn {
            position: fixed;
            bottom: 15px;
            background-color: #444;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 30px;
            font-size: 18px;
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        #open-filters-btn {
            right: 15px;
            z-index: 1000;
        }

        #open-pokedex-btn {
            left: 15px;
            z-index: 1000;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: none;
            z-index: 998;
        }
        #overlay.visible { display: block; }

        /* Loading splash: covers the whole page from the moment the HTML
           parses, so nothing underneath (background images, panels, etc.)
           is visible mid-load. The image fades in once it's actually
           loaded, holds for 5s, then the whole thing fades out to reveal
           the Pokédex panel. Sits above everything (including the
           Pokédex panel's click-zone) so it also blocks interaction while
           it's up — no extra JS needed for that, it's just on top. */
        #loading-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        #loading-splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-splash-img {
            width: 40vw;
            min-width: 50vh;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #loading-splash-img.loaded {
            opacity: 1;
        }

	/* Filter Panel */
        #filter-panel {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 100vh; /* fallback for browsers without dvh support */
            height: 100dvh;
            background: #ffffff;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.25);
            transform: translateY(100%);
            transition: transform 0.35s ease;
            z-index: 999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .filter-panel-bg {
            position: absolute;
            inset: -10%;
            z-index: -1;
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/gtzz25xtbyr9exna2k7bs/Pokedex-Background.png?rlkey=wh4zk3w1nbnnincyh7uc4zl1x&st=sge4tped&dl=1");
            background-size: cover;
            background-position: center;
            filter: brightness(0.5);
        }

        #filter-panel.open {
            transform: translateY(0);
        }

        @media (min-width: 900px) {
            #filter-panel {
                left: auto;
                right: 0;
                top: 0;
                bottom: 0;
                width: 480px;
                max-width: 90vw;
                height: 100vh;
                min-height: 0;
                border-radius: 15px 0 0 15px;
                box-shadow: -4px 0 10px rgba(0,0,0,0.25);
                transform: translateX(100%);
            }

            #filter-panel.open {
                transform: translateX(0);
            }

            /* Desktop/landscape: instead of the panel overlaying the gallery
               (which is what #overlay's dimming was for), the gallery
               reserves space on the right equal to the panel's width and
               reflows into what's left — nothing gets covered, so no dimming
               is needed and the gallery stays fully interactive while the
               panel is open. #overlay is force-hidden here since it no
               longer serves a purpose at this breakpoint. */
            body.filters-open {
                padding-right: calc(20px + min(480px, 90vw));
            }

            /* Magnify panel docks left on desktop instead of top, so swap
               which side reserves space (and reset the mobile top rule).
               Must match the panel's own width formula exactly (see
               #image-overlay above) or the reserved space and the panel's
               actual width drift apart as the window is resized. */
            body.viewer-open {
                padding-top: 20px;
                padding-left: calc(20px + min(clamp(480px, 53vw, 100vh), 90vw)); /* fallback for browsers without dvh support */
                padding-left: calc(20px + min(clamp(480px, 53vw, 100dvh), 90vw));
            }

            #overlay {
                display: none !important;
            }
        }

        #filter-top {
            padding: 20px 20px 15px;
            border-bottom: 1px solid #ddd;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
            scrollbar-gutter: stable;
        }

        #filter-scroll {
            overflow-y: auto;
            padding: 15px 20px 90px;
            flex-grow: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
            scrollbar-gutter: stable;
        }

        .filter-section-header {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px;
            text-transform: uppercase;
            color: white;
            text-shadow:
                -1px -1px 0 black,
                 1px -1px 0 black,
                -1px  1px 0 black,
                 1px  1px 0 black;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .filter-section-header:hover {
            opacity: 0.85;
        }

        .filter-section-header::after {
            content: "▼";
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .filter-section-header.collapsed::after {
            transform: rotate(-90deg);
        }

        #filter-scroll > .filter-section-header {
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            padding-top: 14px;
            margin-top: 20px;
        }

        #filter-scroll > .filter-section-header:first-child {
            border-top: none;
            padding-top: 0;
            margin-top: 0;
        }

        .filter-section-header.collapsed {
            margin-bottom: 10px;
        }

	.specific-region-header {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 5px;
            text-transform: uppercase;
            color: white;
            text-shadow:
                -1px -1px 0 black,
                 1px -1px 0 black,
                -1px  1px 0 black,
                 1px  1px 0 black;
            flex-basis: 100%;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 10px;
        }

        .region-group:first-child .specific-region-header {
            border-top: none;
            padding-top: 0;
        }

        .specific-region-header:hover {
            opacity: 0.85;
        }

        .specific-region-header::after {
            content: "▼";
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .specific-region-header.collapsed::after {
            transform: rotate(-90deg);
        }

        .filter-btn {
            background-color: #ddd;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        .filter-btn.include { background-color: #007bff; color: white; }
        .filter-btn.exclude { background-color: #ff4d4d; color: white; }

        #generation-section,
	#regional-pokedex-section,
        #evolution-section,
        #color-section,
        #types-section,
        #abilities-section,
        #other-section {
            display: flex;
            flex-wrap: wrap;
        }

        #generation-section .filter-btn,
	#regional-pokedex-section .filter-btn,
        #evolution-section .filter-btn,
        #color-section .filter-btn,
        #types-section .filter-btn,
        #abilities-section .filter-btn,
        #other-section .filter-btn {
            flex: 1 1 100px;
        }

        #generation-section .own-row,
	#regional-pokedex-section .own-row,
        #evolution-section .own-row,
        #color-section .own-row,
        #types-section .own-row,
        #abilities-section .own-row,
        #other-section .own-row {
            flex-basis: 100%;
        }

        /* Each region group (Kanto, Johto, etc.) is its own flex row so its
           buttons grow to fill space independently of the other regions */
        .region-group {
            display: flex;
            flex-wrap: wrap;
        }

        .region-group .filter-btn {
            flex: 1 1 100px;
        }

        /* Force these two sections into a fixed 2-column layout instead of
           the flexible wrap, so short trailing items (like Teleport/Paradox)
           don't end up stranded alone on their own row */
        #color-section,
        #abilities-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        #color-section .own-row,
        #abilities-section .own-row {
            grid-column: 1 / -1;
        }

        /* Sub-grid for the Mega Evolution / Gigantamax related buttons */
        .evo-mega-gmax-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        #reset-filters-btn {
            display: block;
            width: fit-content;
            margin: 10px auto 0;
        }

        #tag-search {
            padding: 10px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            margin-top: 10px;
        }

        /* ⭐ Responsive Gallery Grid */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 15%));
            gap: 15px;
            max-width: 100%;
            margin: 20px auto;
            padding: 0 10px;
		justify-content: center;
		place-content: center;
        }

        .image-card {
            width: 100%;
            background: transparent;
            display: none;
        }
        .image-card.show { display: block; }

        .image-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            cursor: pointer;
            filter:
                drop-shadow(3px 3px 4px rgba(0,0,0,0.55));
            /* Forces its own stable compositing layer. Without this, a
               lazily-loaded image with a filter can finish decoding without
               the browser properly re-invalidating the filter's expanded
               paint region — leaving the drop-shadow clipped, or the image
               itself invisible, until something else (like a scroll) forces
               a repaint. This is a known interaction between loading="lazy"
               and CSS filter, and became far more visible once the service
               worker started resolving image loads near-instantly instead
               of over the network. */
            transform: translateZ(0);
        }

        /* Marks whichever gallery image is currently shown in the magnify
           panel. Uses the #gallery-halo SVG filter (defined near the top of
           <body>) instead of stacked drop-shadow()s — see that filter's
           comment for why. The 2.5% size lives in that filter's
           feMorphology radius attribute, not here. */
        .image-card img.active-in-viewer {
            filter: url(#gallery-halo);
        }

        /* Magnified view panel — docks to the top on mobile/portrait, and
           to the left on desktop/landscape (the gallery's own reserved
           space, mirroring the filter panel's reserved space on the right).
           Always shares space with the gallery rather than covering it, so
           unlike the filter panel there's no dimming or scroll-lock at any
           breakpoint.

           #viewer-frame's padding (not a percentage on the image itself)
           is what creates the border around the image — matching amounts
           on all four sides. The image's max-width/max-height:100% resolve
           against viewer-frame's own definite, padded content box, which
           avoids a subtlety that caused the old version to bleed off
           screen: percentage sizing on an image nested inside an
           auto-sized wrapper (sized to fit the image itself) is circular,
           and browsers largely ignore percentage heights in that case. */
        #image-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            /* Capped at whichever is smaller: normally 60dvh, but once the
               window gets narrow enough that the image becomes width-
               constrained rather than height-constrained, the panel
               shrinks to match it (padding cancels out the same way the
               landscape width formula does) instead of leaving empty
               space below the image. */
            height: min(60vh, 100vw); /* fallback for browsers without dvh support */
            height: min(60dvh, 100vw);
            background: #111;
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
            transform: translateY(-100%);
            transition: transform 0.35s ease;
            z-index: 999;
            overflow: hidden;
        }

        #image-overlay.visible {
            transform: translateY(0);
        }

        #viewer-frame {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center; /* images are all exactly square, so centering keeps any sub-pixel vw/dvh rounding split evenly rather than collecting at one edge */
        }

        #overlay-img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: none;
        }

        /* Anchored to the panel's own fixed corner (not the image's), so
           it's always in a predictable, reachable spot regardless of the
           image's size or alignment. */
        #image-close-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            font-size: 24px;
            font-family: 'Calibri', 'Trebuchet MS', sans-serif;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (min-width: 900px) {
            #image-overlay {
                top: 0;
                bottom: 0;
                left: 0;
                /* Holds at 480px near the breakpoint (clamp's floor), then
                   grows proportionally with viewport width past that, up
                   to a ceiling of the full viewport height — beyond which
                   a square image can't get any larger anyway. */
                width: clamp(480px, 53vw, 100vh); /* fallback for browsers without dvh support */
                width: clamp(480px, 53vw, 100dvh);
                max-width: 90vw;
                height: 100vh; /* fallback for browsers without dvh support */
                height: 100dvh;
                transform: translateX(-100%);
                box-shadow: 4px 0 10px rgba(0,0,0,0.35);
            }

            #image-overlay.visible {
                transform: translateX(0);
            }
        }

        /* Pokédex Panel — three layered panels */
        #pokedex-panel {
            position: fixed;
            inset: 0;
            z-index: 1500;
            pointer-events: none;
        }

        /* Frame bars: mask the outer edges of panels 2/3. Width is set by
           JS (see anchorFrameBars below) so the bars' inner edge always
           lands 955 native pixels in from the background image's actual
           edge, regardless of window size/aspect — not a percentage
           approximation. The calc() fallback (old formula) only applies
           before that JS runs once on load. These stay as vertical bars
           on the left/right at every aspect ratio, including portrait.
           Sit above panel 1 but below panels 2/3 and panel 4. */
        #pokedex-bar-left,
        #pokedex-bar-right {
            position: absolute;
            top: 0;
            left: 0;
            width: var(--bar-anchor-width, max(1%, calc(50% - 28dvh)));
            height: 100%;
            z-index: 2;
            background-color: #000;
            transition: transform 0.7s ease 1.3s;
            transform: translateX(0);
        }

        #pokedex-bar-right {
            left: auto;
            right: 0;
        }

        #pokedex-panel.closed #pokedex-bar-left {
            transform: translateX(-100%);
            transition: transform 0.7s ease 1.0s;
        }

        #pokedex-panel.closed #pokedex-bar-right {
            transform: translateX(100%);
            transition: transform 0.7s ease 1.0s;
        }

        #pokedex-panel.closed #pokedex-bar-left,
        #pokedex-panel.closed #pokedex-bar-right {
            pointer-events: none;
        }

        #pokedex-panel-1,
        #pokedex-panel-2,
        #pokedex-panel-3,
	#pokedex-panel-4 {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: auto;
        }

        /* Panel 1: back layer — full-screen background. Last to fade out on
           close (after panels 2/3 and the bars finish), first to return on
           open. */
        #pokedex-panel-1 {
            z-index: 1;
            transition: opacity 1s ease 0s;
            opacity: 1;
        }

        #pokedex-panel.closed #pokedex-panel-1 {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease 2.0s;
        }

        /* Panel 4: fades out on close too — this rule was accidentally
           dropped in an earlier restructure, which is why it was staying
           on screen (and clickable) even after "closing". Fades out
           immediately in sync with panels 2/3 retracting off-screen, but
           on open waits and fades in sync with panels 2/3 sliding back
           into frame (matching their 2.3s delay) rather than fading in
           right away. */
	#pokedex-panel-4 {
	    z-index: 4;
            transition: opacity 0.7s ease 2.3s;
            opacity: 1;
	}

        #pokedex-panel.closed #pokedex-panel-4 {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease 0s;
        }

        /* Panel 2: top band, retracts up off the top of the screen on close.
           Delay is 0 when closing (retracts immediately) but delayed when
           opening to wait for panel 1 then the bars to finish first. */
        #pokedex-panel-2 {
            top: 0;
            left: 0;
            width: 100%;
            height: clamp(50vh, 50vh, 100vh); /* fallback for browsers without dvh support */
            height: clamp(50dvh, 50dvh, 100dvh); /* fallback until the JS below sets --real-vh */
            height: calc(var(--real-vh, 100dvh) * 0.5);
            z-index: 3;
            transition: transform 0.7s ease 2.3s;
            transform: translateY(0);
        }

        #pokedex-panel.closed #pokedex-panel-2 {
            transform: translateY(-125%);
            transition: transform 0.7s ease 0s;
        }

        /* Panel 3: bottom band, retracts down off the bottom of the screen on close */
        #pokedex-panel-3 {
            top: auto;
            bottom: 0;
            left: 0;
            width: 100%;
            height: clamp(50vh, 50vh, 100vh); /* fallback for browsers without dvh support */
            height: clamp(50dvh, 50dvh, 100dvh); /* fallback until the JS below sets --real-vh */
            height: calc(var(--real-vh, 100dvh) * 0.5);
            z-index: 3;
            transition: transform 0.7s ease 2.3s;
            transform: translateY(0);
        }

        #pokedex-panel.closed #pokedex-panel-3 {
            transform: translateY(125%);
            transition: transform 0.7s ease 0s;
        }

        /* Safety-net filler: sits entirely BELOW panel 3's own bottom edge —
           it does not overlap panel 3's footprint at all, so it can't block
           the transparent gap in panel 3's artwork where panel 1 shows
           through. Positioned with the static vh unit (not dvh), so it
           never has to recompute or lag. Normally fully off-screen/invisible;
           only revealed if extra viewport space appears below where panel 3
           currently ends during a resize. Same open/close transform as
           panel 3, so it moves with it. */
        #pokedex-safety-filler {
            position: absolute;
            top: auto;
            bottom: -15vh;
            left: 0;
            width: 100%;
            height: 15vh;
            z-index: 3;
            background-color: #000;
            transition: transform 0.7s ease 2.3s;
            transform: translateY(0);
        }

        #pokedex-panel.closed #pokedex-safety-filler {
            transform: translateY(125%);
            transition: transform 0.7s ease 0s;
        }

        /* Shared background layer. Panel 1's is sized slightly larger than its
           panel so the blur doesn't reveal transparent edges; panels 2 & 3
           fill their own (smaller) band exactly. */
        .pokedex-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }

        #pokedex-panel-1 .pokedex-bg {
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/gtzz25xtbyr9exna2k7bs/Pokedex-Background.png?rlkey=wh4zk3w1nbnnincyh7uc4zl1x&st=6wxk3pbg&dl=1");
            background-size: 100% 100%;
        }

        /* All panels below are now permanently height-locked — bound to
           their own box height at every aspect ratio, cropping left/right
           only as needed. The box heights (50dvh / 100dvh) track the live
           viewport — including the mobile address bar showing/hiding —
           so panels 2/3 always sum to exactly the current visible height,
           guaranteeing zero overlap and zero vertical overflow at any
           aspect ratio, with no orientation-based toggling required. */
        #pokedex-panel-2 .pokedex-bg {
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/72338i1u2iw7el4y5i9f4/Pokedex-Top-Half.png?rlkey=z9uvisa8h31ish6xbkfyr2iim&st=kdi9ecrc&dl=1");
            background-size: auto 100%;
            background-repeat: no-repeat;
            background-position: center bottom;
        }

        #pokedex-panel-3 .pokedex-bg {
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/h91i45hi20fbj7crg9cbb/Pokedex-Bottom-Half.png?rlkey=cgklqu52tqihpwr448p1raf9z&st=wf89ried&dl=1");
            background-size: auto 100%;
            background-repeat: no-repeat;
            background-position: center top;
        }

        #pokedex-panel-4 .pokedex-bg {
            background-image: url("https://dl.dropboxusercontent.com/scl/fi/3p3p57wepjvvr5khlq47o/Pokedex-Start-lg.png?rlkey=92nsk6e706gwdlst2puelao8o&st=j03yxkhe&dl=1");
            background-size: auto 50%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Invisible circular click zone matching the 950px graphic centered
           in the 3840x1920 lg image. Height-based, matching panel 4's
           permanently height-locked (and now halved) background above. */

    <!-- Hidden SVG filter used by the gallery's "active in magnify view" halo.
         feGaussianBlur spreads the sprite's alpha shape outward — this is
         isotropic (equally smooth in every direction), unlike feMorphology's
         dilate operator, which per spec uses a rectangular structuring
         element and produces flat, axis-aligned facets on anything but a
         rectangular source shape. The blurred alpha is then thresholded
         back to a hard edge (feComponentTransfer's steep linear ramp,
         clamped to 0/1) at a chosen cutoff, flooded solid blue, and merged
         underneath the original image. Both stdDeviation (blur amount) and
         the threshold cutoff affect the resulting halo's thickness — they
         don't map to a simple "% of size" the way feMorphology's radius did,
         so treat them as a pair to tune together if the thickness needs
         adjusting. -->
    <svg width="0" height="0" style="position: absolute;">

            <feComponentTransfer in="blurred" result="thresholded">
                <feFuncA type="linear" slope="50" intercept="-4.5"/>
            </feComponentTransfer>
            <feFlood flood-color="#1e90ff" result="blueFlood"/>
            <feComposite in="blueFlood" in2="thresholded" operator="in" result="halo"/>

    <script>
        // Keeps panels 2/3's height synced to the TRUE current viewport via
        // the visualViewport API, rather than any CSS viewport unit. Chrome/
        // Edge on Android defers the layout viewport's resize until its own
        // address-bar show/hide animation finishes, then applies it in one
        // jump — which is what caused the lag no CSS unit (vh/dvh/svh/%)
        // could get around, since they're all downstream of that same
        // deferred layout recalculation.
        //
        // visualViewport's own 'resize'/'scroll' events are a big
        // improvement, but don't necessarily fire on every single frame of
        // the browser's own address-bar animation — just at some coarser
        // interval — so there can still be a brief stale beat mid-animation.
        // To close that gap further, once a resize/scroll starts we also
        // poll visualViewport.height on every animation frame for a short
        // window, which tracks as close to the live animation as JS can get.
        (() => {
            const root = document.documentElement;
            const POLL_WINDOW_MS = 600; // keep sampling this long after the last resize/scroll event

            let pollUntil = 0;
            let polling = false;

            function applyHeight() {
                const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                root.style.setProperty('--real-vh', `${height}px`);
            }

            function pollFrame() {
                applyHeight();
                if (performance.now() < pollUntil) {
                    requestAnimationFrame(pollFrame);
                } else {
                    polling = false;
                }
            }

            function startPolling() {
                pollUntil = performance.now() + POLL_WINDOW_MS;
                if (!polling) {
                    polling = true;
                    requestAnimationFrame(pollFrame);
                }
            }

            applyHeight();

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', startPolling);
                window.visualViewport.addEventListener('scroll', startPolling);
            } else {
                window.addEventListener('resize', applyHeight);
            }
        })();
    </script>

    <script>
        // Reusable, reference-counted page-scroll lock. Multiple overlays
        // (splash, Pokédex panel, filter panel, image viewer) can each
        // request a lock independently — e.g. the splash and the Pokédex
        // panel are both "open" simultaneously during the initial auto-open
        // sequence — and the page only actually unlocks once every
        // requester has released it, so one closing early can't
        // accidentally re-enable scrolling while another is still up.
        //
        // Uses position:fixed + a saved scroll offset rather than plain
        // `overflow: hidden` on body, since overflow:hidden alone doesn't
        // reliably block touch-drag scrolling on iOS Safari and some
        // Android browsers — this project has been mobile-driven enough
        // that it's worth doing the more robust version up front.
        window.pageScrollLock = (() => {
            let lockCount = 0;
            let savedScrollY = 0;

            function lock() {
                if (lockCount === 0) {
                    savedScrollY = window.scrollY;
                    document.body.style.position = 'fixed';
                    document.body.style.top = `-${savedScrollY}px`;
                    document.body.style.left = '0';
                    document.body.style.right = '0';
                }
                lockCount++;
            }

            function unlock() {
                lockCount = Math.max(0, lockCount - 1);
                if (lockCount === 0) {
                    document.body.style.position = '';
                    document.body.style.top = '';
                    document.body.style.left = '';
                    document.body.style.right = '';
                    window.scrollTo(0, savedScrollY);
                }
            }

            return { lock, unlock };
        })();
    </script>

    <script>
        // Loading splash sequencing. Attached immediately (not on
        // window load) since the image may finish loading — especially
        // from cache — before the rest of the page/scripts do.
        (() => {
            const MIN_DELAY_BEFORE_FADE_IN = 1000; // at least 1s from page load before the image starts fading in
            const HOLD_DURATION = 4000;            // how long it stays up once fully faded in
            const BG_EXTRA_DELAY = 1000;            // background lingers this long after the image starts fading out

            const pageStart = Date.now(); // approximate page-load reference point; this script runs immediately after <body> opens
            const splash = document.getElementById('loading-splash');
            const splashImg = document.getElementById('loading-splash-img');

            window.pageScrollLock.lock(); // locked for the splash's entire lifetime

            function fadeInImage() {
                splashImg.classList.add('loaded');
                splashImg.addEventListener('transitionend', hold, { once: true });
            }

            function scheduleFadeIn() {
                const elapsed = Date.now() - pageStart;
                const remaining = Math.max(0, MIN_DELAY_BEFORE_FADE_IN - elapsed);
                setTimeout(fadeInImage, remaining);
            }

            function hold() {
                setTimeout(fadeOut, HOLD_DURATION);
            }

            function fadeOut() {
                // Image fades out first...
                splashImg.classList.remove('loaded');
                // ...and the black background follows about a second later.
                setTimeout(() => {
                    splash.classList.add('hidden');
                    splash.addEventListener('transitionend', () => {
                        splash.remove();
                        window.pageScrollLock.unlock();
                    }, { once: true });
                }, BG_EXTRA_DELAY);
            }

            if (splashImg.complete && splashImg.naturalWidth > 0) {
                // Already loaded (e.g. from browser cache) by the time this runs.
                scheduleFadeIn();
            } else {
                splashImg.addEventListener('load', scheduleFadeIn);
                // Fail-safe: don't leave the splash stuck up forever if the image fails to load.
                splashImg.addEventListener('error', fadeOut);
            }
        })();
    </script>

    <script>
        // Register the service worker that caches Pokémon images locally.
        // Requires HTTPS (or localhost) — silently no-ops otherwise, e.g. if
        // this file is opened directly from disk as a file:// URL.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service worker registered, scope:', reg.scope))
                    .catch(err => console.warn('Service worker registration failed:', err));
            });
        }

        let includeFilters = [];
        let excludeFilters = [];
        let typeIncludeFilters = [];
        let typesMatchAll = false;

        const gallery = document.getElementById("gallery");
        const panel = document.getElementById('filter-panel');
        const overlay = document.getElementById('overlay');
        const openBtn = document.getElementById('open-filters-btn');

        const pokedexPanel = document.getElementById("pokedex-panel");
        const pokedexBtn = document.getElementById("open-pokedex-btn");

        // Anchor the frame bars to a fixed point in the background artwork
        // itself (500px in from its native-resolution edge) rather than a
        // percentage of the window. Panels 2/3 use `background-size: auto 100%`
        // (height-locked, width auto-scaled, centered) — so the same math the
        // browser uses to render that background is reproduced here in JS to
        // find where the image's edge actually lands, then add 500 scaled px.
        (() => {
            const ANCHOR_NATIVE_PX = 955;
            const MIN_BAR_FRACTION = 0.01; // keep the old 1% sliver as a floor

            const panel2 = document.getElementById('pokedex-panel-2');
            const panel3 = document.getElementById('pokedex-panel-3');

            function loadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });
            }

            function bgUrlFor(el) {
                const bg = el.querySelector('.pokedex-bg');
                const cssUrl = getComputedStyle(bg).backgroundImage;
                const match = cssUrl.match(/url\(["']?(.*?)["']?\)/);
                return match ? match[1] : null;
            }

            function requiredWidthFor(panelEl, img) {
                const rect = panelEl.getBoundingClientRect();
                if (!rect.height || !img.naturalHeight) return 0;
                const scale = rect.height / img.naturalHeight;
                const renderedImgWidth = img.naturalWidth * scale;
                const imageLeftEdge = (rect.width - renderedImgWidth) / 2; // background-position: center (horizontally)
                return imageLeftEdge + (ANCHOR_NATIVE_PX * scale);
            }

            Promise.all([
                loadImage(bgUrlFor(panel2)),
                loadImage(bgUrlFor(panel3))
            ]).then(([topImg, bottomImg]) => {
                function recalc() {
                    const rect = panel2.getBoundingClientRect();
                    const floorPx = rect.width * MIN_BAR_FRACTION;
                    const needed = Math.max(
                        requiredWidthFor(panel2, topImg),
                        requiredWidthFor(panel3, bottomImg)
                    );
                    const width = Math.max(floorPx, needed);
                    document.documentElement.style.setProperty('--bar-anchor-width', `${width}px`);
                }

                recalc();
                new ResizeObserver(recalc).observe(panel2);
                window.addEventListener('resize', recalc);
            }).catch(err => {
                console.warn('Could not anchor frame bars to background image; falling back to CSS formula.', err);
            });
        })();

        function openPokedexPanels() {
            if (pokedexPanel.classList.contains("closed")) {
                pokedexPanel.classList.remove("closed");
                window.pageScrollLock.lock();
            }
        }

        function closePokedexPanels() {
            if (!pokedexPanel.classList.contains("closed")) {
                pokedexPanel.classList.add("closed");
                window.pageScrollLock.unlock();
            }
        }

        // The panel starts in the "closed" markup state on purpose (see the
        // class on #pokedex-panel) so this fires the exact same slide-in
        // transform animation used by the manual open button, rather than
        // ever rendering the panels open with no animation at all. This
        // whole sequence plays out behind the loading splash, so visually
        // nothing changes for the user — but it's what settles panels 2/3
        // into a correctly laid-out state at load time too, matching what
        // was already working on manual close/reopen.
        requestAnimationFrame(() => {
            requestAnimationFrame(openPokedexPanels);
        });

        pokedexBtn.addEventListener("click", () => {
            const isClosed = pokedexPanel.classList.contains("closed");

            closeFilterPanel();
            closeImageViewer();

            if (isClosed) {
                openPokedexPanels();
            } else {
                closePokedexPanels();
            }
        });

        document.getElementById("pokedex-click-zone").addEventListener("click", closePokedexPanels);

        fetch("https://raw.githubusercontent.com/pmtupokedex/PMTU-Searchable-Pokedex/main/pokemon-data.json")
            .then(response => response.json())
            .then(data => {
                data.forEach(p => {
                    const card = document.createElement("div");
                    card.className = "image-card";
                    card.dataset.tags = p.tags.join(" ");

                    const img = document.createElement("img");
                    img.loading = "lazy";
                    img.src = p.src;
                    img.alt = p.name;

                    card.appendChild(img);
                    gallery.appendChild(card);
                });

                attachImageEvents();
                filterGallery();
            });

        function attachImageEvents() {
            document.querySelectorAll('.image-card img').forEach(img => {
                img.addEventListener('click', () => {
                    if (img.classList.contains('active-in-viewer')) {
                        closeImageViewer();
                    } else {
                        openImageViewer(img);
                    }
                });
            });
        }


        function parseSearchFilters() {
            includeFilters = includeFilters.filter(f => !f.startsWith("search:"));
            excludeFilters = excludeFilters.filter(f => !f.startsWith("search:"));

            const input = document.getElementById('tag-search').value.trim().toLowerCase();
            if (!input) return;

            const parts = input.split(/\s+/);
            parts.forEach(tag => {
                if (tag.startsWith("-")) {
                    excludeFilters.push("search:" + tag.substring(1));
                } else {
                    includeFilters.push("search:" + tag);
                }
            });
        }

        function updateFilters() {
            includeFilters = [];
            excludeFilters = [];
            typeIncludeFilters = [];

            document.querySelectorAll('.filter-btn.include[data-tag]').forEach(btn => {
                const tag = btn.dataset.tag.toLowerCase();
                const inTypesSection = btn.closest('#types-section') !== null;
                if (inTypesSection && typesMatchAll) {
                    typeIncludeFilters.push(tag);
                } else {
                    includeFilters.push(tag);
                }
            });
            document.querySelectorAll('.filter-btn.exclude[data-tag]').forEach(btn =>
                excludeFilters.push(btn.dataset.tag.toLowerCase())
            );

            parseSearchFilters();
            filterGallery();
        }

        function filterGallery() {
            const cards = document.querySelectorAll('.image-card');
            cards.forEach(card => {
                const tags = card.dataset.tags.toLowerCase().split(/\s+/);
                const includeMatch =
                    includeFilters.length === 0 ||
                    includeFilters.some(f => tags.includes(f.replace("search:", "")));
                const typeMatch =
                    typeIncludeFilters.length === 0 ||
                    typeIncludeFilters.every(f => tags.includes(f));
                const excludeMatch =
                    excludeFilters.some(f => tags.includes(f.replace("search:", "")));
                card.classList.toggle('show', includeMatch && typeMatch && !excludeMatch);
            });
        }

        document.getElementById('types-match-toggle').addEventListener('click', function () {
            typesMatchAll = !typesMatchAll;
            this.textContent = typesMatchAll ? "Match: All" : "Match: Any";
            updateFilters();
        });

        function resetFilters() {
            includeFilters = [];
            excludeFilters = [];
            document.getElementById('tag-search').value = "";
            document.querySelectorAll('.filter-btn[data-tag]').forEach(btn =>
                btn.classList.remove('include', 'exclude')
            );
            filterGallery();
        }

        function resetGeneration() {
            document.querySelectorAll('#generation-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetRegional() {
            document.querySelectorAll('#regional-pokedex-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetStage() {
            document.querySelectorAll('#evolution-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetColor() {
            document.querySelectorAll('#color-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetTypes() {
            document.querySelectorAll('#types-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetAbilities() {
            document.querySelectorAll('#abilities-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function resetOther() {
            document.querySelectorAll('#other-section .filter-btn[data-tag]').forEach(btn => {
                btn.classList.remove('include', 'exclude');
                syncTagButtons(btn);
            });
            updateFilters();
        }

        function syncTagButtons(btn) {
            const tag = btn.dataset.tag;
            if (!tag) return;
            document.querySelectorAll(`.filter-btn[data-tag="${tag}"]`).forEach(other => {
                if (other === btn) return;
                other.classList.remove("include", "exclude");
                if (btn.classList.contains("include")) other.classList.add("include");
                if (btn.classList.contains("exclude")) other.classList.add("exclude");
            });
        }

        function toggleIncludeState(btn) {
            if (!btn.dataset.tag) return;
            if (btn.classList.contains("include")) {
                btn.classList.remove("include");
            } else {
                btn.classList.remove("exclude");
                btn.classList.add("include");
            }
            syncTagButtons(btn);
            updateFilters();
        }

        function setExcludeState(btn) {
            if (!btn.dataset.tag) return;
            btn.classList.remove("include");
            btn.classList.add("exclude");
            syncTagButtons(btn);
            updateFilters();
        }

        const LONG_PRESS_MS = 750;

        document.querySelectorAll('.filter-btn[data-tag]').forEach(btn => {
            let pressTimer = null;
            let longPressFired = false;

            const startPress = () => {
                longPressFired = false;
                pressTimer = setTimeout(() => {
                    longPressFired = true;
                    setExcludeState(btn);
                }, LONG_PRESS_MS);
            };

            const cancelPress = () => {
                clearTimeout(pressTimer);
            };

            const endPress = () => {
                clearTimeout(pressTimer);
                if (!longPressFired) {
                    toggleIncludeState(btn);
                }
            };

            btn.addEventListener('pointerdown', startPress);
            btn.addEventListener('pointerup', endPress);
            btn.addEventListener('pointerleave', cancelPress);
            btn.addEventListener('pointercancel', cancelPress);
            btn.addEventListener('contextmenu', (e) => e.preventDefault());
        });

        document.getElementById('show-all-generation').addEventListener('click', resetGeneration);
        document.getElementById('show-all-regional').addEventListener('click', resetRegional);
        document.getElementById('show-all-stage').addEventListener('click', resetStage);
        document.getElementById('show-all-color').addEventListener('click', resetColor);
        document.getElementById('show-all-types').addEventListener('click', resetTypes);
        document.getElementById('show-all-abilities').addEventListener('click', resetAbilities);
        document.getElementById('show-all-other').addEventListener('click', resetOther);
        document.getElementById('reset-filters-btn').addEventListener('click', resetFilters);
        document.getElementById('tag-search').addEventListener('input', updateFilters);

        // Matches the CSS breakpoint where the filter panel switches from a
        // full-screen mobile sheet to a desktop sidebar that shares space
        // with the gallery instead of covering it.
        const desktopFilterQuery = window.matchMedia('(min-width: 900px)');

        // Turns on body's padding transition for a short window right when
        // a panel actually opens/closes, then turns it back off — see the
        // CSS comment on body.panel-animating for why it can't just stay on.
        let panelAnimTimeout = null;
        function beginPanelAnim() {
            document.body.classList.add('panel-animating');
            if (panelAnimTimeout) clearTimeout(panelAnimTimeout);
            panelAnimTimeout = setTimeout(() => {
                document.body.classList.remove('panel-animating');
                panelAnimTimeout = null;
            }, 500); // 400ms base * 1.25, slowed 25% to match body.panel-animating's transition duration
        }

        function openFilterPanel() {
            if (!panel.classList.contains('open')) {
                panel.classList.add('open');
                closeImageViewer();
                beginPanelAnim();
                if (desktopFilterQuery.matches) {
                    // Desktop: gallery reserves space and stays interactive —
                    // no dimming, no scroll lock needed.
                    document.body.classList.add('filters-open');
                } else {
                    // Mobile: panel is full-screen, so the gallery underneath
                    // is genuinely hidden — dim it and lock scrolling.
                    overlay.classList.add('visible');
                    window.pageScrollLock.lock();
                }
            }
        }

        function closeFilterPanel() {
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                beginPanelAnim();
                if (desktopFilterQuery.matches) {
                    document.body.classList.remove('filters-open');
                } else {
                    overlay.classList.remove('visible');
                    window.pageScrollLock.unlock();
                }
            }
        }

        // If the breakpoint is crossed while the panel happens to be open
        // (e.g. rotating a tablet), reconcile which mode's side-effects
        // (dimming/lock vs. reserved space) are currently in play, rather
        // than leaving stale ones behind.
        desktopFilterQuery.addEventListener('change', (e) => {
            if (!panel.classList.contains('open')) return;
            if (e.matches) {
                overlay.classList.remove('visible');
                window.pageScrollLock.unlock();
                document.body.classList.add('filters-open');
            } else {
                document.body.classList.remove('filters-open');
                overlay.classList.add('visible');
                window.pageScrollLock.lock();
            }
        });

        function toggleDrawer() {
            if (panel.classList.contains('open')) {
                closeFilterPanel();
            } else {
                openFilterPanel();
            }
        }

        openBtn.addEventListener('click', () => {
            if (!openBtn.disabled) toggleDrawer();
        });

        overlay.addEventListener('click', () => {
            closeFilterPanel();
        });

        const imageOverlay = document.getElementById('image-overlay');
        const overlayImg = document.getElementById('overlay-img');
        const imageCloseBtn = document.getElementById('image-close-btn');

        let activeGalleryImg = null;

        const PANEL_TRANSITION_MS = 500; // matches beginPanelAnim's own duration (0.35s base * 1.25, slowed 25%)

        // Briefly pulses an image to draw the eye to its new position after
        // a scroll settles. Removing the class first and forcing a reflow
        // (offsetWidth read) lets the animation restart cleanly if it's
        // re-triggered before the previous pulse finished, rather than
        // being ignored because the class was already present.
        function pulseAttention(img) {
            img.classList.remove('gallery-pulse');
            void img.offsetWidth;
            img.classList.add('gallery-pulse');
            img.addEventListener('animationend', () => {
                img.classList.remove('gallery-pulse');
            }, { once: true });
        }

        // While the panel is actually opening/closing, the gallery's layout
        // keeps reflowing continuously for the whole transition (body's
        // padding is animating), so a single delayed scroll would target a
        // position that's already stale by the time it fires. Instead this
        // nudges the scroll a fraction of the way toward "in view" every
        // frame for the transition's duration — a full instant correction
        // each frame (via scrollIntoView) is what made it feel snappy, since
        // it jumps the whole distance in one go the moment the image goes
        // out of view rather than moving gradually the whole time. A
        // guaranteed hard snap at the very end cleans up whatever small
        // residual is left from chasing a moving target with partial steps.
        function trackImageIntoView(img, duration) {
            const start = performance.now();
            const SMOOTHING = 0.25; // fraction of the remaining distance corrected per frame

            function neededScrollDelta() {
                const rect = img.getBoundingClientRect();
                const vh = window.innerHeight;
                const vw = window.innerWidth;

                // Vertically, always aim for centered rather than just
                // nudging back into view — this is what makes the final
                // resting position centered rather than flush to an edge.
                const dy = (rect.top + rect.height / 2) - (vh / 2);

                let dx = 0;
                if (rect.left < 0) dx = rect.left;
                else if (rect.right > vw) dx = rect.right - vw;

                return { dx, dy };
            }

            function step(now) {
                const { dx, dy } = neededScrollDelta();
                if (dx !== 0 || dy !== 0) {
                    window.scrollBy(dx * SMOOTHING, dy * SMOOTHING);
                }
                if (now - start < duration) {
                    requestAnimationFrame(step);
                } else {
                    img.scrollIntoView({ behavior: 'auto', block: 'center', inline: 'nearest' });
                    pulseAttention(img);
                }
            }
            requestAnimationFrame(step);
        }

        function openImageViewer(galleryImg) {
            const alreadyOpen = document.body.classList.contains('viewer-open');

            if (activeGalleryImg) {
                activeGalleryImg.classList.remove('active-in-viewer');
            }
            activeGalleryImg = galleryImg;
            galleryImg.classList.add('active-in-viewer');

            overlayImg.src = galleryImg.src;
            imageOverlay.classList.add('visible');
            beginPanelAnim();
            document.body.classList.add('viewer-open');

            closeFilterPanel();

            if (alreadyOpen) {
                // Panel's already open, just switching images — nothing is
                // reflowing, so a single ordinary smooth scroll is enough.
                galleryImg.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                if ('onscrollend' in window) {
                    // 'scrollend' isn't available in every browser yet, so
                    // this only pulses where it's supported rather than
                    // guessing at a smooth-scroll's duration with a timer.
                    document.addEventListener('scrollend', () => pulseAttention(galleryImg), { once: true });
                }
            } else {
                trackImageIntoView(galleryImg, PANEL_TRANSITION_MS);
            }
        }

        function closeImageViewer() {
            const wasOpen = document.body.classList.contains('viewer-open');
            const previouslyActive = activeGalleryImg;

            if (activeGalleryImg) {
                activeGalleryImg.classList.remove('active-in-viewer');
                activeGalleryImg = null;
            }

            imageOverlay.classList.remove('visible');
            overlayImg.src = "";
            beginPanelAnim();
            document.body.classList.remove('viewer-open');

            // Always re-center on close, on both mobile and desktop — this
            // is also what makes the pulse afterward land in a consistent,
            // predictable spot rather than only sometimes appearing.
            if (previouslyActive && wasOpen) {
                trackImageIntoView(previouslyActive, PANEL_TRANSITION_MS);
            }
        }

        imageOverlay.addEventListener('click', (e) => {
            if (e.target !== overlayImg && e.target !== imageCloseBtn) closeImageViewer();
        });

        imageCloseBtn.addEventListener('click', closeImageViewer);

        // Clicking empty space in the gallery (not on a card/image) closes
        // the magnify panel if it's open.
        gallery.addEventListener('click', (e) => {
            if (e.target === gallery) closeImageViewer();
        });

        document.querySelectorAll('.filter-section-header').forEach(header => {
            header.classList.add('collapsed');
            if (header.nextElementSibling) {
                header.nextElementSibling.style.display = 'none';
            }
            header.addEventListener('click', () => {
                header.classList.toggle('collapsed');
                const section = header.nextElementSibling;
                if (section) {
                    section.style.display = header.classList.contains('collapsed') ? 'none' : '';
                }
            });
        });

        document.querySelectorAll('.specific-region-header').forEach(header => {
            header.classList.add('collapsed');
            let sibling = header.nextElementSibling;
            while (sibling) {
                sibling.style.display = 'none';
                sibling = sibling.nextElementSibling;
            }
            header.addEventListener('click', () => {
                header.classList.toggle('collapsed');
                const collapsed = header.classList.contains('collapsed');
                let sib = header.nextElementSibling;
                while (sib) {
                    sib.style.display = collapsed ? 'none' : '';
                    sib = sib.nextElementSibling;
                }
            });
        });

        filterGallery();

    </script>
</body>
</html>
